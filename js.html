  function openUnitsManagerModal() {
    document.getElementById('units-manager-modal').style.display = 'flex';
    renderUnitsList();
  }

  function closeUnitsManagerModal() {
    document.getElementById('units-manager-modal').style.display = 'none';
  }

  function renderUnitsList() {
    const ul = document.getElementById('unit-list-ul');
    if (!ul) return;
    ul.innerHTML = '';
    
    if (allIngredientUnits.length === 0) {
      ul.innerHTML = '<li style="padding: 1rem; text-align: center; color: var(--text-muted);">ไม่มีข้อมูลหน่วยวัด</li>';
      return;
    }
    
    allIngredientUnits.forEach(unit => {
      const li = document.createElement('li');
      li.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.06);";
      
      const span = document.createElement('span');
      span.textContent = unit.UnitName;
      span.style.color = "var(--text-primary)";
      span.style.fontWeight = "500";
      
      const btn = document.createElement('button');
      btn.className = "btn";
      const isAdmin = unit.Username && unit.Username.toLowerCase() === 'admin';
      
      if (isAdmin) {
        btn.style.cssText = "background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 0.25rem 0.5rem; font-size: 0.75rem; cursor: not-allowed;";
        btn.textContent = "ของระบบ";
        btn.disabled = true;
      } else {
        btn.style.cssText = "background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; padding: 0.25rem 0.5rem; font-size: 0.75rem; cursor: pointer;";
        btn.textContent = "ลบ";
        btn.onclick = function() {
          handleDeleteUnit(unit.UnitName);
        };
      }
      
      li.appendChild(span);
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  function handleAddUnit() {
    const input = document.getElementById('new-unit-input');
    const name = input.value.trim();
    if (!name) {
      alert('กรุณากรอกชื่อหน่วยวัด');
      return;
    }
    
    if (allIngredientUnits.some(u => u.UnitName.toLowerCase() === name.toLowerCase())) {
      alert('มีหน่วยวัดนี้อยู่ในระบบแล้ว');
      return;
    }
    
    showLoader('กำลังเพิ่มหน่วยวัด...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        input.value = '';
        showToast('เพิ่มหน่วยวัดสำเร็จ', 'success');
        loadIngredientUnits(function() {
          renderUnitsList();
        });
      } else {
        alert('ไม่สามารถเพิ่มหน่วยวัดได้: ' + res.error);
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      alert('เกิดข้อผิดพลาด: ' + err.toString());
    }).addIngredientUnit(name, loggedInUsername);
  }

  function handleDeleteUnit(name) {
    if (!confirm(`คุณต้องการลบหน่วยวัด "${name}" ใช่หรือไม่?`)) return;
    
    showLoader('กำลังลบหน่วยวัด...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        showToast('ลบหน่วยวัดสำเร็จ', 'success');
        loadIngredientUnits(function() {
          renderUnitsList();
        });
      } else {
        alert('ไม่สามารถลบหน่วยวัดได้: ' + res.error);
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      alert('เกิดข้อผิดพลาด: ' + err.toString());
    }).deleteIngredientUnit(name, loggedInUsername);
  }

    document.getElementById('modal-name').value = '';

  function showEditIngredientModal(id) {
    const item = ingredientStockData.find(i => i.ID === id);
    if (!item) return;
    
    editingIngredientId = id;
    document.getElementById('modal-title').textContent = 'แก้ไขข้อมูลวัตถุดิบ';

    document.getElementById('modal-category').value = item.Category || 'อื่นๆ';
    
    loadIngredientUnits(function() {
      document.getElementById('modal-unit').value = item.Unit || 'กก.';
    });
    
    document.getElementById('modal-quantity').value = item.Quantity || 0;
    document.getElementById('modal-min-quantity').value = item.MinQuantity || 0;
    document.getElementById('modal-price').value = item.Price || 0;
    document.getElementById('modal-supplier').value = item.Supplier || '';
    document.getElementById('modal-note').value = item.Note || '';
    
    document.getElementById('modal-quantity').disabled = true;
    document.getElementById('ingredient-modal').style.display = 'flex';

    document.getElementById('ingredient-modal').style.display = 'none';
  }

  function saveIngredient() {
    const name = document.getElementById('modal-name').value.trim();
    if (!name) {
      alert('กรุณากรอกชื่อวัตถุดิบ');
      return;
    }
    
    const qty = parseFloat(document.getElementById('modal-quantity').value) || 0;
    if (!editingIngredientId && qty < 0) {
      alert('ปริมาณเริ่มต้นต้องไม่น้อยกว่า 0');
      return;
    }
    
    const item = {
      ID: editingIngredientId,
      Name: name,
      Category: document.getElementById('modal-category').value,
      Unit: document.getElementById('modal-unit').value.trim() || 'กก.',
      Quantity: qty,
      MinQuantity: parseFloat(document.getElementById('modal-min-quantity').value) || 0,
      Price: parseFloat(document.getElementById('modal-price').value) || 0,
      Supplier: document.getElementById('modal-supplier').value.trim(),
      Note: document.getElementById('modal-note').value.trim()
    };
    
    showLoader('กำลังบันทึกข้อมูลวัตถุดิบ...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        closeIngredientModal();
        showToast('บันทึกข้อมูลวัตถุดิบสำเร็จ', 'success');
        const savedId = editingIngredientId || (res.item && res.item.ID);
        const existingIdx = ingredientStockData.findIndex(i => i.ID === savedId);
        if (existingIdx >= 0) {
          ingredientStockData[existingIdx] = { ...ingredientStockData[existingIdx], ...item, ID: savedId };
        } else {
          ingredientStockData.push({ ...item, ID: savedId });
        }
        updateStockDatalist();
        refreshProductionIngredientsPrices();
        renderIngredientStock();
      } else {
        alert('เกิดข้อผิดพลาด: ' + res.error);
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ' + err.toString());
    }).saveIngredientItem(item, loggedInUsername);
  }

  // --- Delete ---
  function deleteIngredient(id, name) {
    if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบวัตถุดิบ "${name}" ออกจากระบบ?`)) {
      showLoader('กำลังลบข้อมูลวัตถุดิบ...');

          showToast('ลบข้อมูลวัตถุดิบเรียบร้อย', 'success');
          ingredientStockData = ingredientStockData.filter(i => i.ID !== id);
          updateStockDatalist();
          refreshProductionIngredientsPrices();
          renderIngredientStock();
        } else {
          alert('เกิดข้อผิดพลาด: ' + res.error);
        }
      }).withFailureHandler(function(err) {
        hideLoader();
        alert('เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว: ' + err.toString());
      }).deleteIngredientItem(id, loggedInUsername);
    }

  // --- ADMIN USERS MANAGEMENT FUNCTIONS ---
  function toggleRegisterMode(showRegister) {
    const loginForm = document.getElementById('login-form-fields');
    const registerForm = document.getElementById('register-form-fields');
    const loginTitle = document.getElementById('login-title');
    
    if (showRegister) {
      loginForm.style.display = 'none';
      registerForm.style.display = 'flex';
      loginTitle.textContent = 'สมัครสมาชิกใหม่';
    } else {
      loginForm.style.display = 'grid';
      registerForm.style.display = 'none';
      loginTitle.textContent = 'เข้าสู่ระบบ';
    }
  }

  function handleRegisterSubmit(e) {
    e.preventDefault();
    const username = document.getElementById('register-username').value.trim();
    const password = document.getElementById('register-password').value;
    const confirmPassword = document.getElementById('register-confirm-password').value;
    
    if (!username || !password || !confirmPassword) {
      showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
      return;
    }
    
    if (password !== confirmPassword) {
      showToast('รหัสผ่านไม่ตรงกัน', 'error');
      return;
    }
    
    showLoader('กำลังลงทะเบียน...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        showToast('ลงทะเบียนสำเร็จ! กรุณารอการอนุมัติสิทธิ์จากแอดมินก่อนเข้าใช้งาน', 'success');
        // Clear fields
        document.getElementById('register-username').value = '';
        document.getElementById('register-password').value = '';
        document.getElementById('register-confirm-password').value = '';
        // Switch to login card
        toggleRegisterMode(false);
      } else {
        showToast(res.error || 'ไม่สามารถลงทะเบียนได้', 'error');
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      showToast('เกิดข้อผิดพลาดในการลงทะเบียน', 'error');
    }).registerUser(username, password);
  }

  let allAdminUsers = [];

  function adminGetUsers() {
    showLoader('กำลังโหลดรายชื่อผู้ใช้...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (Array.isArray(res)) {
        allAdminUsers = res;
        filterAdminUsers();
      } else {
        showToast((res && res.error) || 'ไม่สามารถโหลดข้อมูลผู้ใช้ได้', 'error');
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      showToast('เกิดข้อผิดพลาดในการดึงข้อมูลผู้ใช้', 'error');
    }).adminGetUsers();
  }

  function filterAdminUsers() {
    const searchQuery = document.getElementById('admin-search-user').value.toLowerCase().trim();
    const roleFilter = document.getElementById('admin-filter-role').value;
    const tableBody = document.getElementById('admin-users-table-body');
    
    tableBody.innerHTML = '';
    
    const filtered = allAdminUsers.filter(u => {
      const matchesSearch = u.Username.toLowerCase().includes(searchQuery);
      const matchesRole = roleFilter === 'all' || u.Role.toLowerCase() === roleFilter.toLowerCase();
      return matchesSearch && matchesRole;
    });
    
    if (filtered.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="5" style="padding: 2rem; text-align: center; color: var(--text-muted);">ไม่พบข้อมูลผู้ใช้งาน</td></tr>`;
      return;
    }
    
    filtered.forEach(u => {
      const tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid rgba(255,255,255,0.06)';
      tr.style.background = 'rgba(255,255,255,0.01)';
      
      const isApproved = parseInt(u.Approved) === 1;
      const statusBadge = isApproved 
        ? `<span class="badge badge-success" style="cursor: pointer; padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.75rem; background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3);" onclick="adminToggleStatus('${u.Username}', 0)">อนุมัติแล้ว</span>`
        : `<span class="badge badge-warning" style="cursor: pointer; padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.75rem; background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3);" onclick="adminToggleStatus('${u.Username}', 1)">รออนุมัติ</span>`;
      
      const isAdmin = u.Role && u.Role.toLowerCase() === 'admin';
      const roleBadge = isAdmin
        ? `<span class="badge badge-info" style="cursor: pointer; padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.75rem; background: rgba(6,182,212,0.15); color: #22d3ee; border: 1px solid rgba(6,182,212,0.3);" onclick="adminChangeRole('${u.Username}', 'User')">แอดมิน</span>`
        : `<span class="badge badge-secondary" style="cursor: pointer; padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.75rem; background: rgba(156,163,175,0.15); color: #cbd5e1; border: 1px solid rgba(156,163,175,0.3);" onclick="adminChangeRole('${u.Username}', 'admin')">สมาชิก</span>`;
      
      const isSelf = u.Username.toLowerCase() === loggedInUsername.toLowerCase();
      const deleteBtn = isSelf 
        ? `<button class="btn btn-sm btn-secondary" style="opacity: 0.4; cursor: not-allowed; padding: 0.25rem 0.5rem; font-size: 0.75rem;" disabled>ลบ</button>`
        : `<button class="btn btn-sm" style="background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="adminDeleteUser('${u.Username}')">ลบ</button>`;
         
      const changePassBtn = `<button class="btn btn-secondary btn-sm" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; background: rgba(255,255,255,0.06); color: #fff;" onclick="openAdminPasswordModal('${u.Username}')">เปลี่ยนรหัส</button>`;
      
      tr.innerHTML = `
        <td style="padding: 0.75rem; font-weight: 500; color: #fff; text-align: left;">${u.Username} ${isSelf ? '<small style="color: var(--color-cyan);">(คุณ)</small>' : ''}</td>
        <td style="padding: 0.75rem; text-align: left; font-family: monospace; color: var(--text-secondary);">${u.Password || ''}</td>
        <td style="padding: 0.75rem; text-align: center;">${roleBadge}</td>
        <td style="padding: 0.75rem; text-align: center;">${statusBadge}</td>
        <td style="padding: 0.75rem; text-align: center; display: flex; gap: 0.5rem; justify-content: center; align-items: center;">
          ${changePassBtn}
          ${deleteBtn}
        </td>
      `;
      
      tableBody.appendChild(tr);
    });
  }

  function adminToggleStatus(username, approvedVal) {
    const user = allAdminUsers.find(u => u.Username === username);
    if (!user) return;
    saveUserAPI(username, null, user.Role, approvedVal);
  }

  function adminChangeRole(username, newRole) {
    const user = allAdminUsers.find(u => u.Username === username);
    if (!user) return;
    saveUserAPI(username, null, newRole, user.Approved);
  }

    showLoader('กำลังบันทึกข้อมูล...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
         showToast('บันทึกข้อมูลผู้ใช้เรียบร้อยแล้ว', 'success');
         adminGetUsers();
      } else {
         showToast(res.error || 'ไม่สามารถบันทึกข้อมูลได้', 'error');
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'error');
    }).adminSaveUser(username, password, role, approved);
  }

    targetPasswordChangeUser = username;

    document.getElementById('admin-pwd-input').value = '';

  function closeAdminPasswordModal() {
    document.getElementById('admin-password-modal').style.display = 'none';

  function submitAdminPasswordChange() {
    const newPassword = document.getElementById('admin-pwd-input').value.trim();
    if (!newPassword) {
      showToast('กรุณากรอกรหัสผ่านใหม่', 'error');
      return;
    }
    
    const user = allAdminUsers.find(u => u.Username === targetPasswordChangeUser);
    if (!user) return;
    
    const targetUser = targetPasswordChangeUser;
    closeAdminPasswordModal();
    saveUserAPI(targetUser, newPassword, user.Role, user.Approved);
  }

  function calculateSodaCost() {
    const volume = parseFloat(document.getElementById('soda-volume').value) || 0;
    const water = parseFloat(document.getElementById('soda-water').value) || 0;
    const sugar = parseFloat(document.getElementById('soda-sugar').value) || 0;
    const yeast = parseFloat(document.getElementById('soda-yeast').value) || 0;
    const materialWeight = parseFloat(document.getElementById('soda-material-weight').value) || 0;
    const flavourAmt = parseFloat(document.getElementById('soda-flavour-amount').value) || 0;

    // คำนวณต้นทุนวัตถุดิบเฉลี่ยคาดคะเน (ในราคาเฉลี่ยตลาดทั่วไป)
    const costWater = water * 1.5;
    const costSugar = sugar * 0.026;
    const costYeast = yeast * 1.2;
    const costFlavour = flavourAmt * 0.35;
    const costMaterial = materialWeight * 0.08;
    const totalCost = costWater + costSugar + costYeast + costFlavour + costMaterial;

    // คำนวณน้ำหนักรวมวัตถุดิบ (กิโลกรัม)
    const totalWeightKg = ((water * 1000) + sugar + yeast + materialWeight + flavourAmt) / 1000;

    // อัปเดตตารางสรุปราคาวัตถิบ
    updateSodaRecipeTable(water, sugar, yeast, materialWeight, flavourAmt, costWater, costSugar, costYeast, costMaterial, costFlavour);

    // อัปเดตยอดประเมินใน tfoot
    const elWeight = document.getElementById('soda-lbl-total-weight');
    const elCost = document.getElementById('soda-lbl-total-cost');

    if (elWeight) elWeight.textContent = totalWeightKg.toFixed(2);
    if (elCost) elCost.textContent = totalCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ฿';
  }

  function recalculateSodaCostFromInputs() {
    // ดึงราคาต้นทุนจากการกรอกตรงๆ ในตาราง
    const costWater = parseFloat(document.getElementById('soda-item-cost-water').value) || 0;
    const costSugar = parseFloat(document.getElementById('soda-item-cost-sugar').value) || 0;
    const costYeast = parseFloat(document.getElementById('soda-item-cost-yeast').value) || 0;
    const costMaterial = parseFloat(document.getElementById('soda-item-cost-material').value) || 0;
    const costFlavour = parseFloat(document.getElementById('soda-item-cost-flavour').value) || 0;
    
    const totalCost = costWater + costSugar + costYeast + costMaterial + costFlavour;

    // อัปเดตยอดรวมในตาราง
    const elCost = document.getElementById('soda-lbl-total-cost');

    if (elCost) elCost.textContent = totalCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ฿';
  }

  function saveSodaBatch() {
    const title = document.getElementById('soda-batch-title').value.trim();
    const date = document.getElementById('soda-batch-date').value;
    const status = document.getElementById('soda-batch-status').value;
    const volume = parseFloat(document.getElementById('soda-volume').value) || 0;
    const flavour = document.getElementById('soda-flavour-type').value.trim();

    if (!title || !date || volume <= 0 || !flavour) {
      showToast('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน (ชื่อแบทช์, วันที่, ปริมาตร, กลิ่นรส)', 'error');
      return;
    }

    const water = parseFloat(document.getElementById('soda-water').value) || 0;
    const sugar = parseFloat(document.getElementById('soda-sugar').value) || 0;
    const yeast = parseFloat(document.getElementById('soda-yeast').value) || 0;
    const materialWeight = parseFloat(document.getElementById('soda-material-weight').value) || 0;
    const flavourAmt = parseFloat(document.getElementById('soda-flavour-amount').value) || 0;
    const brix = parseFloat(document.getElementById('soda-brix').value) || 0;
    const brixFinal = parseFloat(document.getElementById('soda-brix-final').value) || 0;
    const note = document.getElementById('soda-note').value.trim();

    // ดึงราคาทุนจริงในตาราง
    let costWater = water * 1.5;
    let costSugar = sugar * 0.026;
    let costYeast = yeast * 1.2;
    let costFlavour = flavourAmt * 0.35;
    let costMaterial = materialWeight * 0.08;

    const elCostWater = document.getElementById('soda-item-cost-water');
    if (elCostWater) costWater = parseFloat(elCostWater.value) || 0;
    const elCostSugar = document.getElementById('soda-item-cost-sugar');
    if (elCostSugar) costSugar = parseFloat(elCostSugar.value) || 0;
    const elCostYeast = document.getElementById('soda-item-cost-yeast');
    if (elCostYeast) costYeast = parseFloat(elCostYeast.value) || 0;
    const elCostMaterial = document.getElementById('soda-item-cost-material');
    if (elCostMaterial) costMaterial = parseFloat(elCostMaterial.value) || 0;
    const elCostFlavour = document.getElementById('soda-item-cost-flavour');
    if (elCostFlavour) costFlavour = parseFloat(elCostFlavour.value) || 0;

    const totalCost = costWater + costSugar + costYeast + costFlavour + costMaterial;

    const fermentDays = parseInt(document.getElementById('soda-ferment-days').value) || 0;
    
    // คำนวณวันเดือนปีที่เสร็จสิ้นอัตโนมัติ
    let calculatedDateEnd = document.getElementById('soda-batch-date-end').value || '';
    if (date && fermentDays >= 0) {
      const d = new Date(date);
      if (!isNaN(d.getTime())) {
        d.setDate(d.getDate() + fermentDays);
        calculatedDateEnd = d.toISOString().split('T')[0];
      }
    }

    const raw = {
      spiritsType: 'โซดา',
      water: water,
      sugar: sugar,
      yeast: yeast,
      materialWeight: materialWeight,
      flavourType: flavour,
      flavourAmount: flavourAmt,
      brix: brix,
      brixFinal: brixFinal,
      volume: volume,
      totalCost: totalCost,
      costDetails: {
        water: costWater,
        sugar: costSugar,
        yeast: costYeast,
        material: costMaterial,
        flavour: costFlavour
      },
      fizzyLevel: document.getElementById('soda-fizzy-level').value,
      tasteScore: document.getElementById('soda-taste-score').value,
      isReal: document.getElementById('chk-soda-real').checked,
      isTest: document.getElementById('chk-soda-test').checked,
      testResult: status === 'เสร็จสิ้นการทำโซดา' ? document.getElementById('soda-batch-test-result').value : 'รอเทส',
      dateEnd: calculatedDateEnd
    };

    const batchObj = {
      ID: editingSodaBatchId || null,
      Title: title,
      Date: date,
      Status: status,
      FermentationDays: fermentDays,
      FormulaType: 10, // 10: soda
      RawData: raw,
      Username: loggedInUsername
    };

    if (editingSodaBatchId) {
      const old = batches.find(b => b.ID === editingSodaBatchId);
      if (old) {
        batchObj.CreatedAt = old.CreatedAt;
      }
    }

    const isNewSoda = !editingSodaBatchId;
    showLoader('กำลังบันทึกข้อมูลแบทช์โซดา...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      showToast('บันทึกแบทช์โซดาเรียบร้อยแล้ว!', 'success');

      // 1. Auto Stock Deduction for Soda
      const autoDeductSoda = document.getElementById('chk-soda-auto-deduct-stock') && document.getElementById('chk-soda-auto-deduct-stock').checked;
      if (autoDeductSoda && isNewSoda && res && res.ID) {
        const sodaIngredients = [
          { name: 'น้ำตาลทราย', qty: sugar, unit: 'กรัม' },
          { name: 'ยีสต์', qty: yeast, unit: 'กรัม' }
        ];
        if (flavour && flavourAmt > 0) {
          sodaIngredients.push({ name: flavour, qty: flavourAmt, unit: 'กรัม' });
        }
        google.script.run.withSuccessHandler(function(deductRes) {
          if (deductRes && deductRes.deductedCount > 0) {
            showToast(`ตัดสต๊อกวัตถุดิบทำโซดาอัตโนมัติ ${deductRes.deductedCount} รายการ`, 'info');
          }
        }).deductBatchStock(res.ID, res.Title, sodaIngredients, loggedInUsername);
      }

      // 2. Telegram Alert
      sendTelegramBatchCreatedAlert(res || batchObj, 'โซดา', status);

      resetSodaFormToNew();
      fetchBatches(false);
      navigateToSection('soda-spirits');
    }).withFailureHandler(function(err) {
      hideLoader();
      alert('บันทึกแบทช์โซดาล้มเหลว: ' + err.toString());
    }).saveBatch(batchObj);
  }

    document.getElementById('soda-material-weight').value = raw.materialWeight || '';
    document.getElementById('soda-flavour-amount').value = raw.flavourAmount || '';
    document.getElementById('soda-brix').value = raw.brix || '';
    document.getElementById('soda-brix-final').value = raw.brixFinal || '';
    document.getElementById('soda-fizzy-level').value = raw.fizzyLevel || '3';
    document.getElementById('soda-taste-score').value = raw.tasteScore || '3';
    document.getElementById('soda-batch-test-result').value = raw.testResult || 'รอเทส';

    if (raw.costDetails) {

      if (document.getElementById('soda-item-cost-sugar')) document.getElementById('soda-item-cost-sugar').value = raw.costDetails.sugar || 0;
      if (document.getElementById('soda-item-cost-yeast')) document.getElementById('soda-item-cost-yeast').value = raw.costDetails.yeast || 0;
      if (document.getElementById('soda-item-cost-material')) document.getElementById('soda-item-cost-material').value = raw.costDetails.material || 0;
      if (document.getElementById('soda-item-cost-flavour')) document.getElementById('soda-item-cost-flavour').value = raw.costDetails.flavour || 0;
      recalculateSodaCostFromInputs();
    }
    
    document.getElementById('soda-editing-banner').style.display = 'flex';
    navigateToSection('create-soda');

  function updateSodaSugarFromWater() {
    const waterVal = parseFloat(document.getElementById('soda-water').value) || 0;
    const sugarInput = document.getElementById('soda-sugar');
    if (sugarInput) {
      const calculatedSugar = waterVal * 200; // น้ำตาล 20% ของน้ำสะอาด (1 ลิตร = 1,000 กรัม, 20% = 200 กรัม)
      sugarInput.value = calculatedSugar > 0 ? Math.round(calculatedSugar) : '';
    }
    
    const yeastInput = document.getElementById('soda-yeast');
    if (yeastInput) {
      const calculatedYeast = waterVal * 60; // หัวเชื้อ/ยีสต์ 6% ของน้ำสะอาด (1 ลิตร = 1,000 กรัม, 6% = 60 กรัม)
      yeastInput.value = calculatedYeast > 0 ? calculatedYeast.toFixed(1) : '';
    }
    calculateSodaCost();
  }

  function onSodaVolumeInput() {
    const volumeVal = parseFloat(document.getElementById('soda-volume').value) || 0;
    const waterInput = document.getElementById('soda-water');
    if (waterInput && (!waterInput.value || parseFloat(waterInput.value) === 0)) {
      waterInput.value = volumeVal;
      updateSodaSugarFromWater();
    } else {
      calculateSodaCost();
    }
  }

  function updateSodaEndDateFromDays() {
    const startDateVal = document.getElementById('soda-batch-date').value;
    const daysVal = parseInt(document.getElementById('soda-ferment-days').value) || 0;
    const endDateInput = document.getElementById('soda-batch-date-end');
    if (startDateVal && endDateInput) {
      const d = new Date(startDateVal);
      if (!isNaN(d.getTime())) {
        d.setDate(d.getDate() + daysVal);
        endDateInput.value = d.toISOString().split('T')[0];
      }
    }
  }

  function updateSodaFormDynamicFields() {
    const status = document.getElementById('soda-batch-status').value;
    const groupDays = document.getElementById('soda-ferment-days-group');
    const groupDateEnd = document.getElementById('soda-date-end-group');
    const groupTestResult = document.getElementById('soda-test-result-group');
    
    if (status === 'รอหมักโซดา') {
      if (groupDays) groupDays.style.display = 'none';
      if (groupDateEnd) groupDateEnd.style.display = 'none';
      if (groupTestResult) groupTestResult.style.display = 'none';
    } else if (status === 'หมักโซดา') {
      if (groupDays) groupDays.style.display = 'block';
      if (groupDateEnd) groupDateEnd.style.display = 'block';
      if (groupTestResult) groupTestResult.style.display = 'none';
    } else if (status === 'เสร็จสิ้นการทำโซดา') {
      if (groupDays) groupDays.style.display = 'block';
      if (groupDateEnd) groupDateEnd.style.display = 'block';
      if (groupTestResult) groupTestResult.style.display = 'block';
    }
  }

  let allStockMovements = [];

  function renderStockMovements() {
    const tableBody = document.getElementById('movement-table-body');
    if (!tableBody) return;
    
    tableBody.innerHTML = `
      <tr>
        <td colspan="7" style="padding: 3rem; text-align: center; color: var(--text-muted);">
          กำลังโหลดประวัติเคลื่อนไหวสต๊อก...

      </tr>
    `;

    google.script.run.withSuccessHandler(function(data) {
      allStockMovements = Array.isArray(data) ? data : [];
      filterStockMovements();
    }).withFailureHandler(function(err) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" style="padding: 3rem; text-align: center; color: var(--color-rose);">
            โหลดประวัติขยับสต๊อกล้มเหลว: ${err.toString()}

      `;
    }).getStockMovements(loggedInUsername);

  function filterStockMovements() {
    const tableBody = document.getElementById('movement-table-body');
    if (!tableBody) return;

    const query = document.getElementById('movement-search-input').value.trim().toLowerCase();
    const typeFilter = document.getElementById('movement-type-filter').value;

    let filtered = allStockMovements;

    if (query) {
      filtered = filtered.filter(item => 
        item.IngredientName && item.IngredientName.toLowerCase().includes(query)
      );
    }

    if (typeFilter) {
      filtered = filtered.filter(item => item.MovementType === typeFilter);
    }

    if (filtered.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="8" style="padding: 3rem; text-align: center; color: var(--text-muted);">
            ไม่พบประวัติการเคลื่อนไหวที่ตรงตามเงื่อนไข
          </td>
        </tr>
      `;
      return;
    }

    tableBody.innerHTML = filtered.map(item => {
      // Format Date
      let formattedDate = item.Date || '';
      if (formattedDate) {
        const d = new Date(formattedDate);
        if (!isNaN(d.getTime())) {
          formattedDate = d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
        }
      }

      // Movement Type Badge styling
      let badgeColor = 'var(--text-muted)';
      let badgeBg = 'rgba(255,255,255,0.05)';
      if (item.MovementType === 'รับเข้า') {
        badgeColor = 'var(--color-emerald)';
        badgeBg = 'var(--color-emerald-bg)';
      } else if (item.MovementType === 'จ่ายออก') {
        badgeColor = 'var(--color-rose)';
        badgeBg = 'var(--color-rose-bg)';
      } else if (item.MovementType === 'ปรับปรุงยอด') {
        badgeColor = 'var(--color-cyan)';
        badgeBg = 'rgba(6, 182, 212, 0.15)';
      }

      const mTypeBadge = `
        <span class="badge" style="color: ${badgeColor}; border: 1px solid ${badgeColor}; background: ${badgeBg}; font-weight: bold; padding: 0.25rem 0.5rem; border-radius: 6px;">
          ${item.MovementType === 'รับเข้า' ? '📥 รับเข้า' : item.MovementType === 'จ่ายออก' ? '📤 จ่ายออก' : '⚙️ ปรับยอด'}
        </span>
      `;

      // เช็คสิทธิ์และแสดงปุ่มลบ (แสดงเฉพาะผู้บันทึก)
      const isSelf = item.Username && item.Username.toLowerCase() === loggedInUsername.toLowerCase();
      const deleteBtn = isSelf 
        ? `<button class="btn btn-sm" style="background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color: #f87171; padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="deleteStockMovement('${item.ID}')">ลบ</button>`
        : `<button class="btn btn-sm btn-secondary" style="opacity: 0.4; cursor: not-allowed; padding: 0.25rem 0.5rem; font-size: 0.75rem;" disabled>ลบ</button>`;

      return `
        <tr style="border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s;">
          <td style="padding: 0.85rem 1rem; color: var(--text-primary); font-size: 0.9rem; white-space: nowrap;">${formattedDate}</td>
          <td style="padding: 0.85rem 1rem; color: var(--text-primary); font-weight: 600; font-size: 0.9rem;">${item.IngredientName}</td>
          <td style="padding: 0.85rem 1rem; text-align: center;">${mTypeBadge}</td>
          <td style="padding: 0.85rem 1rem; text-align: right; color: var(--text-primary); font-weight: bold; font-size: 0.95rem;">${(item.Quantity || 0).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 2 })}</td>
          <td style="padding: 0.85rem 1rem; color: var(--text-muted); font-size: 0.85rem;">${item.Unit || ''}</td>
          <td style="padding: 0.85rem 1rem; color: var(--text-secondary); font-size: 0.85rem;">${item.Note || '-'}</td>
          <td style="padding: 0.85rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">${item.Username || '-'}</td>
          <td style="padding: 0.85rem 1rem; text-align: center;">${deleteBtn}</td>
        </tr>
      `;
    }).join('');
  }

  function saveStockMovement() {
    const date = document.getElementById('movement-date').value;
    const ingredientId = document.getElementById('movement-ingredient-id').value;
    const type = document.getElementById('movement-type').value;
    const quantity = parseFloat(document.getElementById('movement-quantity').value);
    const note = document.getElementById('movement-note').value.trim();

    if (!date) {
      alert('กรุณาระบุวันเดือนปีที่ทำรายการ');
      return;
    }
    if (!ingredientId) {
      alert('กรุณาเลือกวัตถุดิบ');
      return;
    }
    if (isNaN(quantity) || quantity <= 0) {
      alert('กรุณาระบุจำนวนที่ถูกต้อง (มากกว่า 0)');
      return;
    }

    showLoader('กำลังบันทึกรายการเคลื่อนไหวสต๊อก...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        closeMovementModal();
        showToast('บันทึกการปรับเปลี่ยนสต๊อกเรียบร้อยแล้ว', 'success');
        renderStockMovements();
      } else {
        alert('บันทึกผิดพลาด: ' + res.error);
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      alert('เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว: ' + err.toString());
    }).saveStockMovement(ingredientId, type, quantity, date, note, loggedInUsername);
  }

  function generateQrSvg(text, size) {
    const s = size || 110;
    const encoded = encodeURIComponent(text);
    return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=${s}x${s}&data=${encoded}&margin=2" width="${s}" height="${s}" alt="QR Code" style="display:block; border-radius:4px; max-width:100%; height:auto;" onerror="this.outerHTML='<div style=\\'font-size:0.7rem;color:#888;padding:1rem;\\'>QR Code: ${text}</div>'">`;
  }

  function openTankTagModal(batchId) {
    const batch = batches.find(b => b.ID === batchId);
    if (!batch) {
      showToast('ไม่พบข้อมูลแบทช์', 'error');
      return;
    }

    let raw = {};
    try {
      raw = typeof batch.RawData === 'string' ? JSON.parse(batch.RawData) : (batch.RawData || {});
    } catch(e) {
      raw = {};
    }

    const type = raw.spiritsType || (batch.FormulaType === 10 ? 'โซดา' : 'สุรากลั่น');
    const isSoda = type === 'โซดา';
    
    // Fill Tag Details
    document.getElementById('tag-batch-title').textContent = batch.Title || '-';
    document.getElementById('tag-batch-id').textContent = batch.ID || '-';
    document.getElementById('tag-batch-status').textContent = batch.Status || '-';
    document.getElementById('tag-batch-type-badge').textContent = type;
    document.getElementById('tag-batch-user').textContent = batch.Username || loggedInUsername || '-';

    // Dates
    document.getElementById('tag-batch-start-date').textContent = batch.Date || '-';
    const endDate = raw.dateFermentEnd || raw.dateEnd || '-';
    document.getElementById('tag-batch-end-date').textContent = endDate;

    // Formula & Target
    let formulaName = 'สูตรมาตรฐาน';
    if (isSoda) {
      formulaName = raw.flavourType ? `คราฟต์โซดา (${raw.flavourType})` : 'คราฟต์โซดา';
      document.getElementById('tag-batch-target').textContent = `${raw.brix || 0} → ${raw.brixFinal || 0} Brix`;
    } else {
      const fNum = parseInt(batch.FormulaType) || 1;
      const fNames = { 1: 'สูตรที่ 1: ข้าวเหนียวดั้งเดิม', 2: 'สูตรที่ 2: น้ำตาล+ข้าว', 3: 'สูตรที่ 3: ผลไม้หลัก', 4: 'สูตรที่ 4: น้ำผลไม้ล้วน', 5: 'สูตรที่ 5: ข้าวโพด' };
      formulaName = fNames[fNum] || `สูตรที่ ${fNum}`;
      const targetDeg = raw.adjTargetDeg || (raw.formulaInputs && raw.formulaInputs.f1TargetDegree) || 40;
      document.getElementById('tag-batch-target').textContent = `${targetDeg}° (${raw.distillVolReal || 0} ลิตร)`;
    }
    document.getElementById('tag-batch-formula').textContent = formulaName;

    // Progress
    let progressTxt = `สถานะ: ${batch.Status}`;
    if (batch.Date) {
      const startDate = new Date(batch.Date);
      const today = new Date();
      if (!isNaN(startDate.getTime())) {
        const diffDays = Math.max(0, Math.floor((today - startDate) / (1000 * 60 * 60 * 24)));
        progressTxt = `⏳ ดำเนินการมาแล้ว ${diffDays} วัน (${batch.Status})`;
      }
    }
    document.getElementById('tag-batch-progress-text').textContent = progressTxt;

    // Generate QR Code containing URL to open the batch directly
    const directUrl = `${window.location.origin}${window.location.pathname}#batch-${batch.ID}`;
    const qrContainer = document.getElementById('tag-qr-code-container');
    qrContainer.innerHTML = generateQrSvg(directUrl, 105);

  function openSensoryModal(batchId) {
    const batch = batches.find(b => b.ID === batchId);
    if (!batch) {
      showToast('ไม่พบข้อมูลแบทช์', 'error');
      return;
    }

    document.getElementById('sensory-batch-id').value = batch.ID;
    document.getElementById('sensory-batch-title-display').textContent = `${batch.Title} (${batch.ID})`;

    let raw = {};
    try {
      raw = typeof batch.RawData === 'string' ? JSON.parse(batch.RawData) : (batch.RawData || {});
    } catch(e) {
      raw = {};
    }

    const s = raw.sensoryData || {};

    // Populate Fields
    document.getElementById('sensory-clarity').value = s.clarity || 'ใสบริสุทธิ์ (Brilliant / Clear)';
    document.getElementById('sensory-color').value = s.color || '';
    
    // Aroma
    const aromaScore = s.aromaScore || 4;
    document.getElementById('sensory-aroma-score').value = aromaScore;
    document.getElementById('sensory-aroma-score-txt').textContent = aromaScore;

    // Aroma Tags
    const savedTags = new Set(s.aromaTags || []);
    document.querySelectorAll('#sensory-aroma-tags .sensory-tag-chip').forEach(chip => {
      const tagTxt = chip.textContent.trim();
      if (savedTags.has(tagTxt)) {
        chip.classList.add('active');
      } else {
        chip.classList.remove('active');
      }
    });

    // Palate Sliders
    const sweet = s.sweetness || 2;
    document.getElementById('sensory-sweetness').value = sweet;
    document.getElementById('sensory-sweet-val').textContent = sweet;

    const acid = s.acidity || 2;
    document.getElementById('sensory-acidity').value = acid;
    document.getElementById('sensory-acid-val').textContent = acid;

    const smooth = s.smoothness || 4;
    document.getElementById('sensory-smoothness').value = smooth;
    document.getElementById('sensory-smooth-val').textContent = smooth;

    const warmth = s.warmth || 3;
    document.getElementById('sensory-warmth').value = warmth;
    document.getElementById('sensory-warm-val').textContent = warmth;

    // Finish & Decision
    document.getElementById('sensory-finish-length').value = s.finishLength || 'ปานกลาง (Medium Finish)';
    document.getElementById('sensory-qc-decision').value = s.qcDecision || 'ผ่านเกณฑ์จำหน่ายจริง (Passed)';
    document.getElementById('sensory-notes').value = s.notes || '';

  // ==========================================
  // PRODUCTION CALENDAR & TODAY'S TASKS MODULE
  // ==========================================
  let calDate = new Date();

  function calendarPrevMonth() {
    calDate.setMonth(calDate.getMonth() - 1);
    renderProductionCalendar();
  }

  function calendarNextMonth() {
    calDate.setMonth(calDate.getMonth() + 1);
    renderProductionCalendar();
  }

  function calendarGoToToday() {
    calDate = new Date();
    renderProductionCalendar();
  }

  function renderProductionCalendar() {
    const grid = document.getElementById('production-calendar-grid');
    const titleEl = document.getElementById('calendar-month-year-title');
    if (!grid || !titleEl) return;

    const year = calDate.getFullYear();
    const month = calDate.getMonth();

    const thaiMonths = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];
    titleEl.textContent = `${thaiMonths[month]} ${year + 543}`;

    const typeFilter = document.getElementById('calendar-type-filter') ? document.getElementById('calendar-type-filter').value : 'all';

    // Filter batches
    const activeBatches = batches.filter(b => {
      if (typeFilter === 'all') return true;
      let raw = {};
      try {
        raw = typeof b.RawData === 'string' ? JSON.parse(b.RawData) : (b.RawData || {});
      } catch(e) {}
      const bType = raw.spiritsType || (b.FormulaType === 10 ? 'โซดา' : 'สุรากลั่น');
      return bType === typeFilter;
    });

    grid.innerHTML = '';

    const firstDayIndex = new Date(year, month, 1).getDay(); // 0 = Sun, 1 = Mon ...
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    const todayStr = new Date().toISOString().split('T')[0];

    // 1. Previous month trailing days
    for (let i = firstDayIndex - 1; i >= 0; i--) {
      const dayNum = prevMonthDays - i;
      const cell = document.createElement('div');
      cell.className = 'calendar-day-cell other-month';
      cell.innerHTML = `<div class="calendar-date-header"><span>${dayNum}</span></div>`;
      grid.appendChild(cell);
    }

    // 2. Current month days
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isToday = dateStr === todayStr;

      const cell = document.createElement('div');
      cell.className = `calendar-day-cell ${isToday ? 'today' : ''}`;
      
      let eventsHtml = '';

      activeBatches.forEach(b => {
        let raw = {};
        try {
          raw = typeof b.RawData === 'string' ? JSON.parse(b.RawData) : (b.RawData || {});
        } catch(e) {}

        const bType = raw.spiritsType || (b.FormulaType === 10 ? 'โซดา' : 'สุรากลั่น');
        const startDate = b.Date;
        const endDate = raw.dateFermentEnd || raw.dateEnd;

        let isDueDay = false;
        let isStartDay = false;
        let eventLabel = '';

        if (endDate && dateStr === endDate) {
          isDueDay = true;
          eventLabel = `🔔 ${b.Title} (ครบกำหนด)`;
        } else if (startDate && dateStr === startDate) {
          isStartDay = true;
          eventLabel = `🍶 ${b.Title} (เริ่มหมัก)`;
        } else {
          // Check post-fermentations milestones
          const pFerments = raw.postFermentations || [];
          for (let pf of pFerments) {
            if (pf.endDate && dateStr === pf.endDate) {
              isDueDay = true;
              eventLabel = `🔔 ${b.Title} (ครบหมักเพิ่ม)`;
              break;
            } else if (pf.startDate && dateStr === pf.startDate) {
              isStartDay = true;
              eventLabel = `🧪 ${b.Title} (เริ่มหมักเพิ่ม)`;
              break;
            }
          }
        }

        // Only show badge if date matches a milestone / alert date
        if (isDueDay || isStartDay) {
          let pillClass = 'pill-distilled';
          if (bType === 'สุราแช่') pillClass = 'pill-brewed';
          else if (bType === 'สุราหมัก') pillClass = 'pill-fermented';
          else if (bType === 'โซดา') pillClass = 'pill-soda';

          eventsHtml += `
            <div class="calendar-event-pill ${pillClass}" onclick="${bType === 'โซดา' ? 'loadSodaBatchToEdit' : 'loadBatchToForm'}(batches.find(x => x.ID === '${b.ID}'))" title="${b.Title} (${b.Status})">
              ${eventLabel}
            </div>
          `;
        }
      });

      cell.innerHTML = `
        <div class="calendar-date-header">
          <span>${day}</span>
          ${isToday ? '<span style="font-size:0.65rem; color:var(--color-amber); font-weight:700;">วันนี้</span>' : ''}
        </div>
        <div style="display:flex; flex-direction:column; gap:2px; overflow-y:auto; max-height:80px;">
          ${eventsHtml}
        </div>
      `;

      grid.appendChild(cell);
    }

    // 3. Next month leading days to complete grid (up to multiple of 7)
    const totalCells = firstDayIndex + daysInMonth;
    const nextDays = (7 - (totalCells % 7)) % 7;
    for (let j = 1; j <= nextDays; j++) {
      const cell = document.createElement('div');
      cell.className = 'calendar-day-cell other-month';
      cell.innerHTML = `<div class="calendar-date-header"><span>${j}</span></div>`;
      grid.appendChild(cell);
    }
  }

  function renderTodayTasks() {
    const todayList = document.getElementById('calendar-today-tasks-list');
    const upcomingList = document.getElementById('calendar-upcoming-tasks-list');
    if (!todayList || !upcomingList) return;

    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    const sevenDaysLater = new Date();
    sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);
    const sevenDaysStr = sevenDaysLater.toISOString().split('T')[0];

    const todayBatches = [];
    const upcomingBatches = [];

    batches.forEach(b => {
      let raw = {};
      try {
        raw = typeof b.RawData === 'string' ? JSON.parse(b.RawData) : (b.RawData || {});
      } catch(e) {}

      const bType = raw.spiritsType || (b.FormulaType === 10 ? 'โซดา' : 'สุรากลั่น');
      const endDate = raw.dateFermentEnd || raw.dateEnd;

      if (endDate) {
        if (endDate === todayStr) {
          todayBatches.push({ batch: b, bType: bType, endDate: endDate });
        } else if (endDate > todayStr && endDate <= sevenDaysStr) {
          upcomingBatches.push({ batch: b, bType: bType, endDate: endDate });
        }
      }
    });

    // Render Today
    if (todayBatches.length === 0) {
      todayList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 1.5rem 0;">ไม่มีแบทช์ที่ครบกำหนดในวันนี้</p>';
    } else {
      todayList.innerHTML = '';
      todayBatches.forEach(item => {
        const row = document.createElement('div');
        row.style.background = 'rgba(245, 158, 11, 0.08)';
        row.style.border = '1px solid rgba(245, 158, 11, 0.3)';
        row.style.padding = '0.75rem 1rem';
        row.style.borderRadius = '8px';
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.alignItems = 'center';
        row.innerHTML = `
          <div>
            <strong style="color: #fff; font-size: 0.95rem;">${item.batch.Title}</strong>
            <div style="font-size: 0.75rem; color: #fbbf24; margin-top: 0.2rem;">
              🔔 ครบกำหนดแล้ว: ${item.endDate} (${item.bType})
            </div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="${item.bType === 'โซดา' ? 'loadSodaBatchToEdit' : 'loadBatchToForm'}(batches.find(x => x.ID === '${item.batch.ID}'))" style="font-size: 0.8rem; padding: 0.3rem 0.6rem;">
            จัดการแบทช์
          </button>
        `;
        todayList.appendChild(row);
      });
    }

    // Render Upcoming
    if (upcomingBatches.length === 0) {
      upcomingList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 1.5rem 0;">ไม่มีแบทช์ที่ใกล้ครบกำหนดในช่วง 7 วันนี้</p>';
    } else {
      upcomingList.innerHTML = '';
      upcomingBatches.forEach(item => {
        const row = document.createElement('div');
        row.style.background = 'rgba(255, 255, 255, 0.03)';
        row.style.border = '1px solid rgba(255, 255, 255, 0.06)';
        row.style.padding = '0.75rem 1rem';
        row.style.borderRadius = '8px';
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.alignItems = 'center';
        row.innerHTML = `
          <div>
            <strong style="color: #fff; font-size: 0.95rem;">${item.batch.Title}</strong>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem;">
              ⏳ ครบกำหนดวันที่: <span style="color: var(--color-cyan);">${item.endDate}</span> (${item.bType})
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="${item.bType === 'โซดา' ? 'loadSodaBatchToEdit' : 'loadBatchToForm'}(batches.find(x => x.ID === '${item.batch.ID}'))" style="font-size: 0.8rem; padding: 0.3rem 0.6rem;">
            ดูข้อมูล
          </button>
        `;
        upcomingList.appendChild(row);
      });
    }

    const startDate = (batch && batch.Date) ? batch.Date : '-';
    const startDateFmt = formatDateTh(startDate) || startDate;

    const endDate = raw.dateFermentEnd || raw.dateEnd || '';
    const endDateFmt = endDate ? (formatDateTh(endDate) || endDate) : 'ไม่ได้ระบุ';

    const days = newDays !== undefined ? newDays : ((batch && batch.FermentationDays) || raw.fermentationDays || raw.fermentDays || 0);

    const msg = `🔄 <b>อัปเดตสถานะแบทช์</b>\n` +
                `แบทช์: <b>${title}</b>\n` +
                `ประเภท: ${type}\n` +

                `วันที่อัปเดต: ${new Date().toLocaleDateString('th-TH')}\n` +
                `ผู้บันทึก: <code>${loggedInUsername || '-'}</code>`;
    
    dispatchTelegramMessage(msg);
  }

  function autoCheckAndNotifyDueBatches(isManual = false) {
    if (!batches || !Array.isArray(batches) || batches.length === 0) {
      if (isManual) showToast('ไม่พบข้อมูลแบทช์ในระบบ', 'info');
      return;
    }

    if (!isManual && systemSettingsData && (systemSettingsData.notify_on_due === 'false' || systemSettingsData.notify_on_due === false)) {
      return;
    }

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    const completedStatuses = [
      'เสร็จสมบูรณ์กลั่น', 'เสร็จสมบูรณ์แช่', 'เสร็จสมบูรณ์หมัก',
      'เสร็จสมบูรณ์', 'เสร็จสิ้นการทำโซดา', 'ประวัติกลั่น', 'ประวัติแช่', 'ประวัติหมัก'
    ];

    let countDueToday = 0;
    let dueBatches = [];

    batches.forEach(b => {
      if (!b || completedStatuses.includes(b.Status)) return;

      let raw = {};
      try {
        raw = typeof b.RawData === 'string' ? JSON.parse(b.RawData) : (b.RawData || {});
      } catch(e) {}

      let endDate = raw.dateFermentEnd || raw.dateEnd;
      if (!endDate) return;
      if (typeof endDate === 'string' && endDate.includes('T')) {
        endDate = endDate.split('T')[0];
      }

      if (endDate === todayStr) {
        countDueToday++;
        const storageKey = `tg_due_notified_${b.ID}_${todayStr}`;
        const alreadyNotified = localStorage.getItem(storageKey);

        if (!alreadyNotified || isManual) {
          dueBatches.push(b);
          localStorage.setItem(storageKey, 'true');
        }
      }
    });

    if (dueBatches.length > 0) {
      dueBatches.forEach((b, idx) => {
        setTimeout(() => {
          sendTelegramDueAlert(b);
        }, idx * 1000);
      });
      if (isManual) {
        showToast(`พบแบทช์ครบกำหนดวันนี้ ${dueBatches.length} รายการ และส่งแจ้งเตือน Telegram แล้ว`, 'success');
      }
    } else {
      if (isManual) {
        showToast(countDueToday > 0 ? 'แบทช์ที่ครบกำหนดวันนี้ได้รับการแจ้งเตือนไปแล้ว' : 'ไม่มีแบทช์ที่ครบกำหนดในวันนี้', 'info');
      }
    }
  }

  function sendTelegramDueAlert(batch) {
    if (!batch) return;

    let raw = {};
    try {
      raw = typeof batch.RawData === 'string' ? JSON.parse(batch.RawData) : (batch.RawData || {});
    } catch(e) {}

    const type = raw.spiritsType || (batch.FormulaType === 10 ? 'โซดา' : 'สุรา');
    const startDate = batch.Date || '-';
    const startDateFmt = formatDateTh(startDate) || startDate;

    const endDate = raw.dateFermentEnd || raw.dateEnd || '';
    const endDateFmt = endDate ? (formatDateTh(endDate) || endDate) : 'วันนี้';

    const days = batch.FermentationDays || raw.fermentationDays || raw.fermentDays || 0;

    const msg = `🚨 <b>แจ้งเตือนแบทช์ครบกำหนดหมักวันนี้!</b>\n` +
                `แบทช์: <b>${batch.Title || '-'}</b>\n` +
                `ประเภท: ${type}\n` +
                `สถานะปัจจุบัน: <b>${batch.Status || '-'}</b>\n` +
                `วันที่เริ่มหมัก: ${startDateFmt}\n` +
                `สิ้นสุดการหมัก: <b>${endDateFmt}</b> (ครบกำหนดวันนี้ ⚠️)\n` +
                `จำนวนวันที่หมัก (วัน): <b>${days} วัน</b>\n` +
                `📌 ถึงกำหนดเปิดถังหมัก / ตรวจสอบการหมักแล้วครับ`;

    dispatchTelegramMessage(msg);
  }

  function triggerDueBatchesCheck(isManual = false) {
    showLoader('กำลังตรวจเช็คแบทช์ที่ครบกำหนดวันนี้...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res && res.success) {
        const count = res.notifiedCount || (res.notifiedList ? res.notifiedList.length : 0);
        if (count > 0) {
          showToast(`ตรวจพบแบทช์ครบกำหนดและส่งแจ้งเตือนเข้า Telegram สำเร็จ ${count} รายการ`, 'success');
        } else {
          showToast('ไม่มีแบทช์ครบกำหนดใหม่ในวันนี้ที่ต้องแจ้งเตือน', 'info');
        }
      } else {
        autoCheckAndNotifyDueBatches(true);
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      autoCheckAndNotifyDueBatches(true);
    }).checkDueBatches(loggedInUsername);
  }

  function setupDailyTelegramTriggerApp() {
    showLoader('กำลังตั้งค่า Trigger อัตโนมัติทุก 08:00 น...');
    if (google.script && google.script.run && typeof google.script.run.setupDailyTelegramTrigger === 'function') {
      google.script.run.withSuccessHandler(function(res) {
        hideLoader();
        if (res && res.success) {
          alert('✅ ' + (res.message || 'ตั้งค่าเรียบร้อยแล้ว'));
        } else {
          alert('❌ ไม่สามารถตั้งค่าได้: ' + (res.error || ''));
        }
      }).withFailureHandler(function(err) {
        hideLoader();
        alert('เกิดข้อผิดพลาด: ' + err.toString());
      }).setupDailyTelegramTrigger();
    } else {
      hideLoader();
      alert('ระบบบน Cloudflare Pages จะตรวจเช็คและแจ้งเตือนอัตโนมัติเมื่อเปิดเว็บ หรือสามารถตั้ง Webhook Cron ไปที่ /api/checkDueBatches ได้ครับ');
    }
  }
</script>
