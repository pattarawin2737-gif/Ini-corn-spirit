  // App Global State
  let batches = [];
  let dashboardData = { scents: [], sweetness: [], fruitFermentation: [], roastedGrainFermentation: [] };
  let checklistTemplate = [];
  let currentFormulaId = 1;
  let editingBatchId = null;
  let editingSodaBatchId = null;
  let customIngredients = [];
  let customAddons = [];
  let loadedAutoIngredients = null;
  let deletedAutoIngredientNames = new Set();
  let f3Sweeteners = [{ name: 'น้ำตาลทรายแดง', bx: 80, qty: 0, unit: 'Kg', liters: 0, ml: 0 }];
  let f3Fruits = [{ name: 'ผลไม้หลัก', qtyPerTank: 0, qtyTotal: 0, unit: 'Kg' }];
  let f4Sweeteners = [{ name: 'น้ำตาลทรายแดง', bx: 80, qty: 0, unit: 'Kg', liters: 0, ml: 0 }];
  let f4Fruits = [{ name: 'ผลไม้หลัก', qtyPerTank: 0, qtyTotal: 0 }];
  let postFermentations = [];
  let listFilters = {
    'list-waiting': 'all',
    'list-fermenting': 'all',
    'list-completed': 'all'
  };
  let loggedInUsername = null;
  let authMode = 'login';
  let ingredientStockData = [];

  function formatDateTh(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  // DOM Elements
  const loader = document.getElementById('loader');
  const loaderMsg = document.getElementById('loader-message');
  const toastContainer = document.getElementById('toast-container');
  const sidebarLinks = document.querySelectorAll('.sidebar-link');
  const sections = document.querySelectorAll('.tab-pane');
  const pageTitle = document.getElementById('page-title');
  const pageSubtitle = document.getElementById('page-subtitle');
  const headerActionsArea = document.getElementById('header-actions-area');
  const menuToggle = document.getElementById('menu-toggle');
  const sidebar = document.getElementById('sidebar');

  // Authentication Logic
  function handleAuthSubmit(e) {
    e.preventDefault();
    const usernameInput = document.getElementById('login-username').value.trim();
    const passwordInput = document.getElementById('login-password').value;
    
    if (!usernameInput || !passwordInput) {
      showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
      return;
    }
    
    showLoader('กำลังเข้าสู่ระบบ...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        loggedInUsername = res.username;
        const userRole = res.role || 'User';
        
        // Remember last credentials & set login state
        localStorage.setItem('spirit_last_username', usernameInput);
        localStorage.setItem('spirit_last_password', passwordInput);
        localStorage.setItem('spirit_is_logged_in', 'true');
        localStorage.setItem('spirit_user_role', userRole);
        
        // Switch UI
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('sidebar-username-display').textContent = loggedInUsername;
        document.getElementById('sidebar-user-info').style.display = 'block';
        
        // Show admin menu item if role is admin
        if (userRole.toLowerCase() === 'admin') {
          document.getElementById('menu-admin-users').style.display = 'flex';
        } else {
          document.getElementById('menu-admin-users').style.display = 'none';
        }
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) appContainer.style.display = 'flex';
        
        showToast('เข้าสู่ระบบสำเร็จ ยินดีต้อนรับ!', 'success');
        
        // Load app user-specific data
        loadUserData();
      } else {
        showToast(res.error || 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง', 'error');
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      showToast('เกิดข้อผิดพลาดในการเชื่อมต่อระบบล็อกอิน', 'error');
    }).validateLogin(usernameInput, passwordInput);
  }

  function autoLogin(username, password) {
    showLoader('กำลังเชื่อมต่อระบบ...');
    google.script.run.withSuccessHandler(function(res) {
      hideLoader();
      if (res.success) {
        loggedInUsername = res.username;
        const userRole = res.role || 'User';
        
        // Ensure state is set
        localStorage.setItem('spirit_is_logged_in', 'true');
        localStorage.setItem('spirit_user_role', userRole);
        
        // Switch UI
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('sidebar-username-display').textContent = loggedInUsername;
        document.getElementById('sidebar-user-info').style.display = 'block';
        
        // Show admin menu item if role is admin
        if (userRole.toLowerCase() === 'admin') {
          document.getElementById('menu-admin-users').style.display = 'flex';
        } else {
          document.getElementById('menu-admin-users').style.display = 'none';
        }
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) appContainer.style.display = 'flex';
        
        // Load app user-specific data
        loadUserData();
      } else {
        localStorage.removeItem('spirit_is_logged_in');
        localStorage.removeItem('spirit_user_role');
        showToast('การเชื่อมต่อหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง', 'error');
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      localStorage.removeItem('spirit_is_logged_in');
      localStorage.removeItem('spirit_user_role');
      showToast('การเชื่อมต่อหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง', 'error');
    }).validateLogin(username, password);
  }

  function handleLogout() {
    loggedInUsername = null;
    localStorage.removeItem('spirit_is_logged_in');
    localStorage.removeItem('spirit_user_role');
    document.getElementById('sidebar-user-info').style.display = 'none';
    document.getElementById('menu-admin-users').style.display = 'none';
    
    const appContainer = document.querySelector('.app-container');
    if (appContainer) appContainer.style.display = 'none';
    
    document.getElementById('login-screen').style.display = 'flex';
    
    const lastUser = localStorage.getItem('spirit_last_username') || '';
    const lastPass = localStorage.getItem('spirit_last_password') || '';
    document.getElementById('login-username').value = lastUser;
    document.getElementById('login-password').value = lastPass;
    
    showToast('ออกจากระบบเรียบร้อยแล้ว', 'success');
  }

  function loadUserData() {
    showLoader('กำลังโหลดข้อมูลผู้ใช้...');
    
    // Preload ingredient stock data so it is immediately available for recipe price calculations
    loadIngredientStockData();
    
    // 1. Get spreadsheet info
    google.script.run.withSuccessHandler(function(info) {
      currentSpreadsheetId = info.id;
      const statusEl = document.getElementById('sheet-connection-status');
      if (statusEl) {
        if (info.id) {
          statusEl.innerHTML = `<span style="color: var(--color-emerald); font-weight: 600;">เชื่อมต่อแล้ว</span>`;
        } else {
          statusEl.innerHTML = `<span style="color: #ef4444; font-weight: 600;">ยังไม่ได้เชื่อมต่อ</span>`;
        }
      }
    }).withFailureHandler(function() {
      const statusEl = document.getElementById('sheet-connection-status');
      if (statusEl) {
        statusEl.innerHTML = `<span style="color: #ef4444; font-weight: 600;">ยังไม่ได้เชื่อมต่อ</span>`;
      }
    }).getSpreadsheetInfo();
    
    // 2. Load dashboard data
    google.script.run.withSuccessHandler(function(data) {
      dashboardData = data;
      renderDashboard();
      
      // 3. Load checklist template and fetch batches for this user
      google.script.run.withSuccessHandler(function(steps) {
        checklistTemplate = steps;
        fetchBatches(true);
      }).getChecklistTemplate();
    }).getDashboardData();
  }

  // Trigger calculations on input change
  document.addEventListener('input', function(e) {
    if (e.target.classList.contains('calc-trigger')) {
      runAllCalculations();
    }
  });

  document.addEventListener('change', function(e) {
    if (e.target.classList.contains('calc-trigger')) {
      runAllCalculations();
    }
  });

  // Mobile menu toggle
  menuToggle.addEventListener('click', function() {
    sidebar.classList.toggle('active');
  });

  // Sidebar navigation router
  sidebarLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const target = this.getAttribute('data-target');
      navigateToSection(target);
      sidebar.classList.remove('active');
    });
  });

  function showLoader(message) {
    loaderMsg.textContent = message || 'กำลังโหลดข้อมูล...';
    loader.classList.add('active');
  }

  function hideLoader() {
    loader.classList.remove('active');
  }

  function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    let icon = '';
    if (type === 'success') {
      icon = '<svg  width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
    } else if (type === 'error') {
      icon = '<svg  width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
    } else {
      icon = '<svg  width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
    }

    toast.innerHTML = `${icon}<span>${message}</span>`;
    toastContainer.appendChild(toast);
    
    setTimeout(() => {
      toast.style.animation = 'none';
      toast.offsetHeight; // trigger reflow
      toast.style.animation = '';
      toast.classList.add('fade-out');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  }

  let currentSpreadsheetId = '';

  // App startup
  window.addEventListener('load', function() {
    hideLoader();
    
    // Check remembered credentials
    const lastUser = localStorage.getItem('spirit_last_username') || '';
    const lastPass = localStorage.getItem('spirit_last_password') || '';
    const isLoggedIn = localStorage.getItem('spirit_is_logged_in') || '';
    
    document.getElementById('login-username').value = lastUser;
    document.getElementById('login-password').value = lastPass;

    if (isLoggedIn === 'true' && lastUser && lastPass) {
      autoLogin(lastUser, lastPass);
    }

    // Default dates & actions
    document.getElementById('batch-date').valueAsDate = new Date();
    document.getElementById('batch-status').addEventListener('change', toggleFermentationDaysRow);
    
    // Auto-calculate end date on input/change
    const bDateInput = document.getElementById('batch-date');
    const bDaysInput = document.getElementById('batch-fermentation-days');
    bDateInput.addEventListener('input', calculateFermentationEndDate);
    bDateInput.addEventListener('change', calculateFermentationEndDate);
    bDaysInput.addEventListener('input', calculateFermentationEndDate);
    bDaysInput.addEventListener('change', calculateFermentationEndDate);

    // Mutual exclusion for production type checkboxes
    const realChk = document.getElementById('chk-prod-real');
    const testChk = document.getElementById('chk-prod-test');
    
    realChk.addEventListener('change', function() {
      if (realChk.checked) {
        testChk.checked = false;
      } else {
        testChk.checked = true;
      }
      toggleSalesProfitCard();
    });
    
    testChk.addEventListener('change', function() {
      if (testChk.checked) {
        realChk.checked = false;
      } else {
        realChk.checked = true;
      }
      toggleSalesProfitCard();
    });

    document.getElementById('batch-expected-sales').addEventListener('input', calculateExpectedProfit);

    setupAddButtons();
    renderFormulaTables(3);
    renderFormulaTables(4);
    
    // Initial display sync
    toggleSalesProfitCard();
    calculateExpectedProfit();
    calculateFermentationEndDate();
  });

  function setDateToToday(inputId) {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    document.getElementById(inputId).value = `${year}-${month}-${day}`;
    if (inputId === 'batch-date') {
      calculateFermentationEndDate();
    }
  }

  function calculateFermentationEndDate() {
    const startDateVal = document.getElementById('batch-date').value;
    const daysVal = parseInt(document.getElementById('batch-fermentation-days').value) || 0;
    const endDateInput = document.getElementById('batch-date-ferment-end');
    
    if (!startDateVal) {
      endDateInput.value = '';
      return;
    }
    
    // Split YYYY-MM-DD manually to avoid timezone parsing offsets (highly robust across Mac Safari/Chrome)
    const parts = startDateVal.split('-');
    if (parts.length !== 3) {
      endDateInput.value = '';
      return;
    }
    
    const year = parseInt(parts[0], 10);
    const month = parseInt(parts[1], 10) - 1; // Month is 0-indexed in Date constructor
    const day = parseInt(parts[2], 10);
    
    const startDate = new Date(year, month, day);
    if (isNaN(startDate.getTime())) {
      endDateInput.value = '';
      return;
    }
    
    startDate.setDate(startDate.getDate() + daysVal);
    
    const outYear = startDate.getFullYear();
    const outMonth = String(startDate.getMonth() + 1).padStart(2, '0');
    const outDay = String(startDate.getDate()).padStart(2, '0');
    
    endDateInput.value = `${outYear}-${outMonth}-${outDay}`;
  }

  function toggleFermentationDaysRow() {
    const status = document.getElementById('batch-status').value;
    const daysRow = document.getElementById('fermentation-days-group');
    if (status === 'กลั่นสุรา' || status === 'กรองสุรา' || status === 'เสร็จสมบูรณ์' ||
        status === 'กลั่นสุรากลั่น' || status === 'กรองสุรากลั่น' || status === 'ประวัติกลั่น' ||
        status === 'ประวัติแช่' || status === 'บ่มน้ำสุราแช่' ||
        status === 'หมักสุรากลั่น' || status === 'หมักสุราแช่' || status === 'หมักสุรา' ||
        status === 'เสร็จสมบูรณ์กลั่น' || status === 'เสร็จสมบูรณ์แช่' ||
        status === 'หมักสุราหมัก' || status === 'กลั่นสุราหมัก' || status === 'กรองสุราหมัก' || status === 'เสร็จสมบูรณ์หมัก' || status === 'ประวัติหมัก') {
      daysRow.style.display = 'block';
    } else {
      daysRow.style.display = 'none';
    }

    const testResultRow = document.getElementById('test-result-group');
    if (testResultRow) {
      if (status === 'เสร็จสมบูรณ์กลั่น' || status === 'เสร็จสมบูรณ์แช่' || status === 'เสร็จสมบูรณ์หมัก' || status === 'ประวัติหมัก') {
        testResultRow.style.display = 'block';
      } else {
        testResultRow.style.display = 'none';
      }
    }
  }

  function toggleSalesProfitCard() {
    const isReal = document.getElementById('chk-prod-real').checked;
    const card = document.getElementById('sales-profit-card');
    if (card) {
      card.style.display = isReal ? 'block' : 'none';
      if (isReal) {
        calculateExpectedProfit();
      }
    }
  }

  function calculateExpectedProfit() {
    let sumIngredients = 0;
    const defaultPrices = document.querySelectorAll('.auto-ingredient-price');
    defaultPrices.forEach(input => {
      sumIngredients += parseFloat(input.value) || 0;
    });
    const customPrices = document.querySelectorAll('.custom-ingredient-price');
    customPrices.forEach(input => {
      sumIngredients += parseFloat(input.value) || 0;
    });
    let sumAddons = 0;
    const addonPrices = document.querySelectorAll('.custom-addon-price');
    addonPrices.forEach(input => {
      sumAddons += parseFloat(input.value) || 0;
    });
    const pkgCost = parseFloat(document.getElementById('batch-pkg-cost').value) || 0;
    const netCost = sumIngredients + sumAddons + pkgCost;

    const expectedSales = parseFloat(document.getElementById('batch-expected-sales').value) || 0;
    const profit = expectedSales - netCost;
    
    const displayEl = document.getElementById('expected-profit-display');
    if (displayEl) {
      displayEl.innerHTML = profit.toFixed(1) + '<span>บาท</span>';
    }
  }

  function calculateDashboardStats() {
    let totalSales = 0;
    let totalCostReal = 0;
    let totalCostTest = 0;

    batches.forEach(batch => {
      let raw;
      try {
        raw = typeof batch.RawData === 'string' ? JSON.parse(batch.RawData) : batch.RawData;
      } catch(e) {
        raw = batch;
      }

      if (!raw) return;

      const prodType = raw.productionType || 'ทำขายจริง';
      const expectedSales = parseFloat(raw.expectedSales) || 0;
      const netCost = parseFloat(raw.netCost) || 0;

      if (prodType === 'ทำขายจริง') {
        totalSales += expectedSales;
        totalCostReal += netCost;
      } else if (prodType === 'ทำทดลองสูตร') {
        totalCostTest += netCost;
      }
    });

    const totalProfitReal = totalSales - totalCostReal;

    const elSales = document.getElementById('stat-total-sales');
    const elCostReal = document.getElementById('stat-total-cost-real');
    const elProfitReal = document.getElementById('stat-total-profit-real');
    const elCostTest = document.getElementById('stat-total-cost-test');

    if (elSales) elSales.textContent = totalSales.toFixed(1) + ' ฿';
    if (elCostReal) elCostReal.textContent = totalCostReal.toFixed(1) + ' ฿';
    if (elProfitReal) {
      elProfitReal.textContent = totalProfitReal.toFixed(1) + ' ฿';
      if (totalProfitReal >= 0) {
        elProfitReal.style.color = 'var(--color-emerald)';
      } else {
        elProfitReal.style.color = '#ef4444';
      }
    }
    if (elCostTest) elCostTest.textContent = totalCostTest.toFixed(1) + ' ฿';
  }

  function fetchBatches(isFirstLoad = false) {
    if (!isFirstLoad) showLoader('กำลังโหลดแบทช์สุรา...');
    google.script.run.withSuccessHandler(function(data) {
      if (data && data.error) {
        hideLoader();
        alert('เกิดข้อผิดพลาดในการดึงข้อมูลจากตาราง Google Sheets:\n' + data.error);
        return;
      }
      batches = data;
      hideLoader();
      
      calculateDashboardStats();
      autoCheckAndNotifyDueBatches();
      
      // If we are currently showing a list section, refresh it
      const activeLink = document.querySelector('.sidebar-link.active');
      if (activeLink) {
        const currentTarget = activeLink.getAttribute('data-target');
        renderListSection(currentTarget);
      }
    }).withFailureHandler(function(err) {
      hideLoader();
      alert('เกิดข้อผิดพลาดจากฝั่งระบบ (Apps Script Failure):\n' + (err.message || err.toString()));
    }).getBatches(loggedInUsername);
  }

  function changeItemColor(el, color) {
    const item = el.closest('.checklist-item');
    if (!item) return;
    
    // Remove previous color classes
    item.classList.remove('color-red', 'color-green', 'color-blue');
    
    // Add new color class
    item.classList.add(`color-${color}`);
    item.setAttribute('data-color', color);
    
    // Update active dot in this picker
    const dots = item.querySelectorAll('.color-dot');
    dots.forEach(dot => dot.classList.remove('active'));
    el.classList.add('active');
  }

  // Checklist Renders
  function renderChecklist(checkedArray, colorsArray) {
    const container = document.getElementById('checklist-steps-container');
    container.innerHTML = '';
    
    checklistTemplate.forEach((step, index) => {
      const stepObj = (typeof step === 'object') ? step : { text: step, color: 'blue' };
      const isChecked = checkedArray && checkedArray[index] === true;
      const color = stepObj.color || 'blue';
      const item = document.createElement('div');
      item.className = `checklist-item ${isChecked ? 'checked' : ''} color-${color}`;
      item.setAttribute('data-index', index);
      item.setAttribute('data-color', color);
      
      item.innerHTML = `
        <div class="checklist-checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="checklist-text">
          <span class="checklist-number">ขั้นตอนที่ ${index + 1}:</span> ${stepObj.text}
        </div>
      `;
      
      item.onclick = function() {
        this.classList.toggle('checked');
      };
      
      container.appendChild(item);
    });
  }

  // Tab switcher inside "做สุรา" calculations card
  function switchSubTab(groupId, targetId) {
    const btns = document.querySelectorAll(`.tabs-container button[onclick*="'${groupId}'"]`);
    btns.forEach(btn => btn.classList.remove('active'));
    
    // Add active to current button
    const activeBtn = Array.from(btns).find(btn => btn.getAttribute('onclick').includes(targetId));
    if (activeBtn) activeBtn.classList.add('active');

    const panes = document.querySelectorAll(`[id^="${groupId}-"]`);
    panes.forEach(pane => pane.classList.remove('active'));

    const targetPane = document.getElementById(`${groupId}-${targetId}`);
    if (targetPane) targetPane.classList.add('active');
  }

      row.innerHTML = `
        <div class="form-group" style="margin-bottom: 0;">
          <label style="font-size: 0.75rem; margin-bottom: 0.25rem;">วันเดือนปี หมักเพิ่มหลังกลั่น</label>
          <input type="date" class="input-control" value="${item.startDate || ''}" onchange="updatePostFermentDate(${idx}, 'startDate', this.value)">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label style="font-size: 0.75rem; margin-bottom: 0.25rem;">วันเดือนปี สิ้นสุดหมักเพิ่ม</label>
          <input type="date" class="input-control" value="${item.endDate || ''}" onchange="updatePostFermentDate(${idx}, 'endDate', this.value)">
        </div>
        <div style="display: flex; height: 100%; align-items: flex-end; justify-content: center; padding-top: 1rem;">
          <button type="button" class="btn btn-danger btn-sm" onclick="removePostFerment(${idx})" style="width: 100%;">ลบ</button>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function updatePostFermentDate(index, field, value) {
    if (postFermentations[index]) {
      postFermentations[index][field] = value;
    }
  }

  function removePostFerment(index) {
    postFermentations.splice(index, 1);
    renderPostFermentations();
  }

  // CORE CALCULATION ENGINES
  function runAllCalculations() {
    if (!editingBatchId) {
      loadedAutoIngredients = null;
    }
    const calcData = calculateValues();
    updateCalculationOutputs(calcData);
    populateRecalculatedIngredients(calcData);
    renderFormulaTables(3);
    renderFormulaTables(4);
  }

  function calculateValues() {
    // 1. Enzyme Calculations
    const type = document.getElementById('batch-type').value;
    const enzTanks = (type === 'สุราหมัก') ? (parseFloat(document.getElementById('fm-tanks').value) || 0) : (parseFloat(document.getElementById('enz-tanks').value) || 0);
    
    // Auto-calculate enzWater based on current selected formula
    let waterPerTank = 80;
    if (type === 'สุราหมัก') {
      waterPerTank = parseFloat(document.getElementById('fm-water-per-tank').value) || 0;
    } else if (currentFormulaId === 1) {
      const f1Size = parseFloat(document.getElementById('f1-tank-size').value) || 0;
      const f1Pct = parseFloat(document.getElementById('f1-water-pct').value) || 0;
      waterPerTank = f1Size * (f1Pct / 100);
    } else if (currentFormulaId === 2) {
      const f2Size = parseFloat(document.getElementById('f2-tank-size').value) || 0;
      const f2Pct = parseFloat(document.getElementById('f2-water-pct').value) || 0;
      waterPerTank = f2Size * (f2Pct / 100);
    } else if (currentFormulaId === 3) {
      const f3Size = parseFloat(document.getElementById('f3-tank-size').value) || 0;
      const f3Pct = parseFloat(document.getElementById('f3-water-pct').value) || 0;
      waterPerTank = f3Size * (f3Pct / 100);
    } else if (currentFormulaId === 4) {
      const f4Size = parseFloat(document.getElementById('f4-tank-size').value) || 0;
      const f4Pct = parseFloat(document.getElementById('f4-water-pct').value) || 0;
      waterPerTank = f4Size * (f4Pct / 100);
    } else if (currentFormulaId === 5) {
      const f5Size = parseFloat(document.getElementById('f5-tank-size').value) || 0;
      const f5Pct = parseFloat(document.getElementById('f5-water-pct').value) || 0;
      waterPerTank = f5Size * (f5Pct / 100);
    }
    
    if (waterPerTank < 0) waterPerTank = 0;
    
    document.getElementById('enz-water-per-tank').value = waterPerTank.toFixed(1);
    const enzWater = waterPerTank;
    
    const waterRatio = 100;
    const enzRatio = 3;
    const yeastRatio = 20;
    const lookpangRatio = 300;
    
    const enzymePerTank = (enzRatio / waterRatio) * enzWater; // E6
    const totalEnzyme = enzymePerTank * enzTanks; // E9
    
    const waterEnz = totalEnzyme; // C4
    const enzymeG = (waterEnz / waterRatio) * 25; // C5
    const yeastG = (waterEnz / waterRatio) * 25; // C6
    const calSulfiteG = (waterEnz / waterRatio) * 15; // C7
    const sugarKg = (waterEnz / waterRatio) * 25; // C8
    const molassesKg = (waterEnz / waterRatio) * 1; // C9
    
    const yeastPerTank = (enzWater / waterRatio) * yeastRatio; // G4
    const totalYeast = yeastPerTank * enzTanks; // G6
    
    const sodiumPerTank = (enzWater / waterRatio) * yeastRatio; // H4
    const totalSodium = sodiumPerTank * enzTanks; // H6
    
    const lookpangPerTank = (enzWater / waterRatio) * lookpangRatio; // G8
    const totalLookpang = lookpangPerTank * enzTanks; // G10

    // 2. Alcohol Correction
    const correctTemp = parseFloat(document.getElementById('correct-temp').value) || 0;
    const correctDeg = parseFloat(document.getElementById('correct-degree').value) || 0;
    const correctedDegree = correctDeg + (0.4 * (20 - correctTemp));

    // 3. Target Degree Adjustment
    const adjWidth = parseFloat(document.getElementById('adj-width').value) || 0;
    const adjHeight = parseFloat(document.getElementById('adj-height').value) || 0;
    const adjCurrDeg = parseFloat(document.getElementById('adj-curr-deg').value) || 0;
    const adjTargetDeg = parseFloat(document.getElementById('adj-target-deg').value) || 1; // avoid /0
    
    const adjVolume = (((adjWidth / 2) * (adjWidth / 2) * adjHeight) / 3.14) / 100; // E3
    const adjTargetVol = (adjVolume * adjCurrDeg) / adjTargetDeg; // I3
    const adjWaterToFill = adjTargetVol - adjVolume; // A5

    // 5. Brewed Spirits Degree (%ABV)
    const brewedBrixBefore = parseFloat(document.getElementById('brewed-brix-before').value) || 0;
    const brewedBrixAfter = parseFloat(document.getElementById('brewed-brix-after').value) || 0;
    const brewedOg = brewedBrixBefore === 0 ? 1.000 : 1.0 + (brewedBrixBefore / (258.6 - ((brewedBrixBefore / 258.2) * 227.1)));
    const ob = brewedBrixBefore;
    const fb = brewedBrixAfter;
    let brewedFg = 1.000;
    if (fb > 0) {
      // Corrected Sean Terrill formula coefficient (from 0.012717 to 0.0012717)
      const rawFg = 1.0000 - 0.0044993 * ob + 0.011774 * fb + 0.00027581 * Math.pow(ob, 2) - 0.0012717 * Math.pow(fb, 2) - 0.0000072800 * Math.pow(ob, 3) + 0.000063293 * Math.pow(fb, 3);
      brewedFg = Math.abs(rawFg); // Enforce absolute value to ensure no negative sign is ever shown
    }
    
    const brewedAbv = brewedOg > brewedFg ? (brewedOg - brewedFg) * 131 : 0.0;

    // 4. Formula Specific Calculations
    let fOutputs = {};

    if (currentFormulaId === 1) {
      // 1. สูตรข้าวหมัก
      const f1Size = parseFloat(document.getElementById('f1-tank-size').value) || 0;
      const f1Pct = parseFloat(document.getElementById('f1-water-pct').value) || 0;
      const f1Sweet = parseFloat(document.getElementById('f1-sweetness').value) || 0;
      const f1DistillYield = parseFloat(document.getElementById('f1-distill-yield').value) || 0;
      const f1TargetDeg = parseFloat(document.getElementById('f1-target-degree').value) || 1;
      
      const f1LiqPerTank = f1Size * (f1Pct / 100); // A8
      const f1WaterPerTank = f1LiqPerTank / 2; // น้ำต่อ 1 ถัง
      const f1WaterTotal = f1WaterPerTank * enzTanks; // น้ำรวมทุกถัง
      const f1RicePerTank = f1WaterPerTank; // B4
      const f1StickyRice = f1RicePerTank / 1.53; // D4
      const f1PlainRice = f1RicePerTank / 3; // E4
      const f1PreDeg = f1Sweet * 0.5; // G4
      
      // สูตรใหม่: (น้ำต่อถัง * preDeg * distillYield) / targetDeg
      const f1LiqGot = (f1WaterPerTank * f1PreDeg * f1DistillYield) / f1TargetDeg;
      const f1LiqLost = f1LiqGot * 0.15;
      const f1LiqRem = f1LiqGot - f1LiqLost;
      
      fOutputs = {
        waterPerTank: f1WaterPerTank,
        waterTotal: f1WaterTotal,
        ricePerTank: f1RicePerTank,
        riceTotal: f1RicePerTank * enzTanks,
        stickyRicePerTank: f1StickyRice,
        stickyRiceTotal: f1StickyRice * enzTanks,
        plainRicePerTank: f1PlainRice,
        plainRiceTotal: f1PlainRice * enzTanks,
        liqGot: f1LiqGot,
        liqLost: f1LiqLost,
        liqRem: f1LiqRem
      };

    } else if (currentFormulaId === 2) {
      // 2. สูตรข้าว + น้ำตาล
      const f2Size = parseFloat(document.getElementById('f2-tank-size').value) || 0;
      const f2Pct = parseFloat(document.getElementById('f2-water-pct').value) || 0;
      const f2Sweet = parseFloat(document.getElementById('f2-sweetness').value) || 0;
      const f2Constant = parseFloat(document.getElementById('f2-temp-select').value) || 6;
      const f2DistillYield = parseFloat(document.getElementById('f2-distill-yield').value) || 0;
      const f2TargetDeg = parseFloat(document.getElementById('f2-target-degree').value) || 1;
      
      const f2LiqPerTank = f2Size * (f2Pct / 100); // A8
      const f2WaterTotal = f2LiqPerTank * enzTanks; // B8
      
      const f2RicePerTank = f2LiqPerTank / f2Constant / 1.2; // D4
      const f2StickyRice = f2RicePerTank / 1.53; // E4
      const f2PlainRice = f2RicePerTank / 3; // F4
      const f2SugarPerTank = (f2LiqPerTank - (f2LiqPerTank / f2Constant)) / 3; // G4
      const f2PreDeg = f2Sweet * 0.5; // H4
      
      const f2LiqGot = (f2WaterTotal * f2PreDeg * f2DistillYield) / f2TargetDeg; // L4
      const f2LiqLost = f2LiqGot * 0.15; // M4
      const f2LiqRem = f2LiqGot - f2LiqLost; // M6
      
      fOutputs = {
        waterPerTank: f2LiqPerTank,
        waterTotal: f2WaterTotal,
        ricePerTank: f2RicePerTank,
        riceTotal: f2RicePerTank * enzTanks,
        stickyRicePerTank: f2StickyRice,
        stickyRiceTotal: f2StickyRice * enzTanks,
        plainRicePerTank: f2PlainRice,
        plainRiceTotal: f2PlainRice * enzTanks,
        sugarPerTank: f2SugarPerTank,
        sugarTotal: f2SugarPerTank * enzTanks,
        liqGot: f2LiqGot,
        liqLost: f2LiqLost,
        liqRem: f2LiqRem
      };

    } else if (currentFormulaId === 3) {
      // 3. สูตรใส่น้ำผลไม้ + ข้าวหรือธัญพืช
      const f3Size = parseFloat(document.getElementById('f3-tank-size').value) || 0;
      const f3Pct = parseFloat(document.getElementById('f3-water-pct').value) || 0;
      const f3Constant = parseFloat(document.getElementById('f3-temp-select').value) || 6;
      const f3TotalJuice = parseFloat(document.getElementById('f3-total-juice').value) || 0;
      
      const f3SweetRice = parseFloat(document.getElementById('f3-sweetness-rice').value) || 0;
      const f3SweetJuice = parseFloat(document.getElementById('f3-sweetness-juice').value) || 0;
      const f3PulpPct = parseFloat(document.getElementById('f3-pulp-pct').value) || 0;
      const f3TargetSweet = parseFloat(document.getElementById('f3-target-sweetness').value) || 28;
      
      const f3DistillYield = parseFloat(document.getElementById('f3-distill-yield').value) || 0;
      const f3TargetDeg = parseFloat(document.getElementById('f3-target-degree').value) || 1;
      
      const f3LiqPerTank = f3Size * (f3Pct / 100); // A8
      const f3JuicePerTank = f3TotalJuice / enzTanks; // D8
      const f3WaterPerTank = f3LiqPerTank - f3JuicePerTank; // B8
      const f3WaterTotal = f3WaterPerTank * enzTanks; // B10
      
      const f3SweetToNeed = f3SweetRice - f3SweetJuice; // E8
      const f3PreDeg = (f3SweetRice + f3SweetJuice) * 0.5; // H4
      const f3LiqGot = ((f3WaterTotal + f3TotalJuice) * f3PreDeg * f3DistillYield) / f3TargetDeg; // L4
      const f3LiqLost = f3LiqGot * 0.15; // M4
      const f3LiqRem = f3LiqGot - f3LiqLost; // M6
      
      // Calculate multiple sweeteners
      let f3SweetLiqTotal = 0;
      f3Sweeteners.forEach(item => {
        const denom = item.bx - f3TargetSweet;
        if (denom > 0) {
          item.liters = ((f3WaterTotal * f3SweetToNeed) * (1 - f3PulpPct / 100)) / denom;
        } else {
          item.liters = 0;
        }
        item.ml = item.liters * 1000;
        f3SweetLiqTotal += item.liters;
      });

      // Calculate multiple fruits
      let f3FruitWtTotal = 0;
      f3Fruits.forEach(item => {
        item.qtyTotal = item.qtyPerTank * enzTanks;
        f3FruitWtTotal += item.qtyTotal;
      });
      
      const f3RicePerTank = ((f3LiqPerTank - f3TotalJuice) / f3Constant) / 1.2; // D4
      const f3StickyRice = f3RicePerTank / 1.53; // E4
      const f3PlainRice = f3RicePerTank / 3; // F4
      const f3SugarPerTank = (((f3LiqPerTank - f3TotalJuice) - ((f3LiqPerTank - f3TotalJuice) / f3Constant))) / 3; // G4

      fOutputs = {
        waterPerTank: f3WaterPerTank,
        waterTotal: f3WaterTotal,
        juicePerTank: f3JuicePerTank,
        juiceTotal: f3TotalJuice,
        needSweetness: f3SweetToNeed,
        sweetLiqPerTank: f3SweetLiqTotal / enzTanks,
        sweetLiqTotal: f3SweetLiqTotal,
        ricePerTank: f3RicePerTank,
        riceTotal: f3RicePerTank * enzTanks,
        stickyRicePerTank: f3StickyRice,
        stickyRiceTotal: f3StickyRice * enzTanks,
        plainRicePerTank: f3PlainRice,
        plainRiceTotal: f3PlainRice * enzTanks,
        sugarPerTank: f3SugarPerTank,
        sugarTotal: f3SugarPerTank * enzTanks,
        liqGot: f3LiqGot,
        liqLost: f3LiqLost,
        liqRem: f3LiqRem
      };

    } else if (currentFormulaId === 4) {
      // 4. สูตรน้ำผลไม้ล้วน
      const f4Size = parseFloat(document.getElementById('f4-tank-size').value) || 0;
      const f4Pct = parseFloat(document.getElementById('f4-water-pct').value) || 0;
      const f4TotalJuice = parseFloat(document.getElementById('f4-total-juice').value) || 0;
      const f4SweetJuice = parseFloat(document.getElementById('f4-sweetness-juice').value) || 0;
      const f4PulpPct = parseFloat(document.getElementById('f4-pulp-pct').value) || 0;
      
      const f4DistillYield = parseFloat(document.getElementById('f4-distill-yield').value) || 0;
      const f4TargetDeg = parseFloat(document.getElementById('f4-target-degree').value) || 1;
      
      const f4LiqPerTank = f4Size * (f4Pct / 100); // A7
      const f4JuicePerTank = f4TotalJuice / enzTanks; // D3
      const f4WaterPerTank = f4LiqPerTank - f4JuicePerTank; // B3
      const f4WaterTotal = f4WaterPerTank * enzTanks; // B5
      
      const f4SugarPerTank = f4LiqPerTank / 3; // E3
      const f4NeedSweetness = 28 - f4SweetJuice; // B9
      const f4PreDeg = f4SweetJuice * 0.5; // E5
      
      const f4LiqGot = ((f4WaterTotal + f4TotalJuice) * f4PreDeg * f4DistillYield) / f4TargetDeg; // I3
      const f4LiqLost = f4LiqGot * 0.15; // K3
      const f4LiqRem = f4LiqGot - f4LiqLost; // K5
      
      // Calculate multiple sweeteners
      let f4SweetLiqTotal = 0;
      f4Sweeteners.forEach(item => {
        const denom = item.bx - 28;
        if (denom > 0) {
          item.liters = ((f4TotalJuice * f4NeedSweetness) * (1 - f4PulpPct / 100)) / denom;
        } else {
          item.liters = 0;
        }
        item.ml = item.liters * 1000;
        f4SweetLiqTotal += item.liters;
      });

      // Calculate multiple fruits
      let f4FruitWtTotal = 0;
      f4Fruits.forEach(item => {
        item.qtyTotal = item.qtyPerTank * enzTanks;
        f4FruitWtTotal += item.qtyTotal;
      });

      fOutputs = {
        waterPerTank: f4WaterPerTank,
        waterTotal: f4WaterTotal,
        juicePerTank: f4JuicePerTank,
        juiceTotal: f4TotalJuice,
        sugarPerTank: f4SugarPerTank,
        sugarTotal: f4SugarPerTank * enzTanks,
        needSweetness: f4NeedSweetness,
        sweetLiqPerTank: f4SweetLiqTotal / enzTanks,
        sweetLiqTotal: f4SweetLiqTotal,
        fruitWtTotal: f4FruitWtTotal,
        liqGot: f4LiqGot,
        liqLost: f4LiqLost,
        liqRem: f4LiqRem
      };
    } else if (currentFormulaId === 5) {
      // 5. สูตรข้าว + ข้าวโพด + น้ำตาล
      const f5Size = parseFloat(document.getElementById('f5-tank-size').value) || 0;
      const f5Pct = parseFloat(document.getElementById('f5-water-pct').value) || 0;
      const f5Sweet = parseFloat(document.getElementById('f5-sweetness').value) || 0;
      const f5Constant = parseFloat(document.getElementById('f5-temp-select').value) || 6;
      const f5DistillYield = parseFloat(document.getElementById('f5-distill-yield').value) || 0;
      const f5TargetDeg = parseFloat(document.getElementById('f5-target-degree').value) || 1;
      
      const f5LiqPerTank = f5Size * (f5Pct / 100); 
      const f5WaterTotal = f5LiqPerTank * enzTanks; 
      
      const f5RicePerTank = (f5LiqPerTank / f5Constant / 1.2) / 2; 
      const f5StickyRice = f5RicePerTank / 1.53; 
      const f5CornPerTank = f5RicePerTank * 0.85; 
      const f5PlainRice = f5RicePerTank / 3;
      const f5SugarPerTank = (f5LiqPerTank - (f5LiqPerTank / f5Constant)) / 3; 
      const f5PreDeg = f5Sweet * 0.5; 
      
      const f5LiqGot = (f5WaterTotal * f5PreDeg * f5DistillYield) / f5TargetDeg; 
      const f5LiqLost = f5LiqGot * 0.15; 
      const f5LiqRem = f5LiqGot - f5LiqLost; 
      
      fOutputs = {
        waterPerTank: f5LiqPerTank,
        waterTotal: f5WaterTotal,
        ricePerTank: f5RicePerTank,
        riceTotal: f5RicePerTank * enzTanks,
        stickyRicePerTank: f5StickyRice,
        stickyRiceTotal: f5StickyRice * enzTanks,
        cornPerTank: f5CornPerTank,
        cornTotal: f5CornPerTank * enzTanks,
        plainRicePerTank: f5PlainRice,
        plainRiceTotal: f5PlainRice * enzTanks,
        sugarPerTank: f5SugarPerTank,
        sugarTotal: f5SugarPerTank * enzTanks,
        liqGot: f5LiqGot,
        liqLost: f5LiqLost,
        liqRem: f5LiqRem
      };
    }

    if (type === 'สุราหมัก') {
      const fmWaterPerTank = parseFloat(document.getElementById('fm-water-per-tank').value) || 0;
      const fmTanks = parseFloat(document.getElementById('fm-tanks').value) || 0;
      const fmDistillYield = parseFloat(document.getElementById('fm-distill-yield').value) || 0;
      const fmDegreeBefore = parseFloat(document.getElementById('fm-degree-before').value) || 0;
      const fmTargetDegree = parseFloat(document.getElementById('fm-target-degree').value) || 1;

      const fmLiqGot = ((fmWaterPerTank * fmDegreeBefore) * (fmDistillYield / 100)) / fmTargetDegree;
      const fmLiqLost = fmLiqGot * 0.15;
      const fmLiqRem = fmLiqGot - fmLiqLost;

      fOutputs = {
        waterPerTank: fmWaterPerTank,
        waterTotal: fmWaterPerTank * fmTanks,
        tanks: fmTanks,
        distillYield: fmDistillYield,
        degreeBefore: fmDegreeBefore,
        targetDegree: fmTargetDegree,
        liqGot: fmLiqGot,
        liqLost: fmLiqLost,
        liqRem: fmLiqRem,
        liqGotTotal: fmLiqGot * fmTanks,
        liqLostTotal: fmLiqLost * fmTanks,
        liqRemTotal: fmLiqRem * fmTanks
      };
    }

    return {
      enzWater: enzWater,
      enzTanks: enzTanks,
      enzymePerTank: enzymePerTank,
      totalEnzyme: totalEnzyme,
      waterEnz: waterEnz,
      enzymeG: enzymeG,
      yeastG: yeastG,
      calSulfiteG: calSulfiteG,
      sugarKg: sugarKg,
      molassesKg: molassesKg,
      yeastPerTank: yeastPerTank,
      totalYeast: totalYeast,
      sodiumPerTank: sodiumPerTank,
      totalSodium: totalSodium,
      lookpangPerTank: lookpangPerTank,
      totalLookpang: totalLookpang,
      correctedDegree: correctedDegree,
      adjVolume: adjVolume,
      adjWaterToFill: adjWaterToFill,
      brewedOg: brewedOg,
      brewedFg: brewedFg,
      brewedAbv: brewedAbv,
      formula: fOutputs
    };
  }

  function updateCalculationOutputs(data) {
    const type = document.getElementById('batch-type').value;
    // 1. Enzyme
    document.getElementById('enz-c4-display').innerHTML = data.waterEnz.toFixed(1) + '<span>ลิตร</span>';
    document.getElementById('enz-c5-display').innerHTML = data.enzymeG.toFixed(1) + '<span>กรัม</span>';
    document.getElementById('enz-c6-display').innerHTML = data.yeastG.toFixed(1) + '<span>กรัม</span>';
    document.getElementById('enz-c7-display').innerHTML = data.calSulfiteG.toFixed(1) + '<span>กรัม</span>';
    document.getElementById('enz-c8-display').innerHTML = data.sugarKg.toFixed(1) + '<span>Kg</span>';
    document.getElementById('enz-c9-display').innerHTML = data.molassesKg.toFixed(1) + '<span>Kg</span>';

    const yeastF4Multi = (currentFormulaId === 4) ? 9 : 1;
    const lookpangMultiplier = (currentFormulaId === 1) ? 2 : 1;
    document.getElementById('enz-yeast-display').innerHTML = (data.yeastPerTank * yeastF4Multi).toFixed(1) + ' / ' + (data.totalYeast * yeastF4Multi).toFixed(1) + '<span>กรัม</span>';
    document.getElementById('enz-sodium-display').innerHTML = data.sodiumPerTank.toFixed(1) + ' / ' + data.totalSodium.toFixed(1) + '<span>กรัม</span>';
    document.getElementById('enz-lookpang-display').innerHTML = (data.lookpangPerTank * lookpangMultiplier).toFixed(1) + ' / ' + (data.totalLookpang * lookpangMultiplier).toFixed(1) + '<span>กรัม</span>';
    document.getElementById('enz-final-display').innerHTML = data.enzymePerTank.toFixed(1) + ' / ' + data.totalEnzyme.toFixed(1) + '<span>ลิตร</span>';

    // 2. Alcohol correction
    document.getElementById('correct-result-display').innerHTML = data.correctedDegree.toFixed(1) + '<span>ดีกรีจริง</span>';

    // 3. Target degree
    document.getElementById('adj-vol-display').innerHTML = data.adjVolume.toFixed(1) + '<span>ลิตร</span>';
    const fillStr = data.adjWaterToFill >= 0 ? data.adjWaterToFill.toFixed(1) + '<span>ลิตร</span>' : 'ไม่ต้องเติมน้ำ (ติดลบ ' + Math.abs(data.adjWaterToFill).toFixed(1) + ' ลิตร)';

  // --- STOCK & RECIPE INGREDIENTS PRICE SYNCHRONIZATION ---
  function updateStockDatalist() {
    const datalist = document.getElementById('stock-ingredients-datalist');
    if (!datalist) return;
    datalist.innerHTML = '';
    if (ingredientStockData && Array.isArray(ingredientStockData)) {
      ingredientStockData.forEach(item => {
        if (item.Name) {
          const opt = document.createElement('option');
          opt.value = item.Name;
          const unitPrice = parseFloat(item.Price) || 0;
          opt.label = `${unitPrice.toFixed(1)} ฿/${item.Unit || 'กก.'}`;
          datalist.appendChild(opt);
        }
      });
    }
  }

  function findStockItem(name) {
    if (!ingredientStockData || !Array.isArray(ingredientStockData) || !name) return null;
    const clean = name.trim().toLowerCase();
    if (!clean) return null;
    const stripped = clean.replace(/^(วัตถุดิบหวาน:\s*|ผลไม้:\s*)/, '').trim();

    // 1. Exact match
    let found = ingredientStockData.find(s => {
      const sName = (s.Name || '').trim().toLowerCase();
      return sName === clean || (stripped && sName === stripped);
    });
    if (found) return found;

    // 2. Substring match
    found = ingredientStockData.find(s => {
      const sName = (s.Name || '').trim().toLowerCase();
      if (!sName) return false;
      return clean.includes(sName) || sName.includes(clean) || (stripped && (stripped.includes(sName) || sName.includes(stripped)));
    });
    return found || null;
  }

  function convertStockPriceToUnit(stockPrice, stockUnit, targetUnit) {
    if (!stockPrice || isNaN(stockPrice)) return 0;
    const sUnit = (stockUnit || '').trim().toLowerCase();
    const tUnit = (targetUnit || '').trim().toLowerCase();

    const isKg = u => (u === 'kg' || u === 'กก.' || u === 'กิโลกรัม');
    const isG = u => (u === 'g' || u === 'กรัม');
    const isL = u => (u === 'l' || u === 'ลิตร');
    const isMl = u => (u === 'ml' || u === 'มล.');

    // Gram to Kg or vice versa
    if (isKg(sUnit) && isG(tUnit)) {
      return stockPrice / 1000.0;
    }
    if (isG(sUnit) && isKg(tUnit)) {
      return stockPrice * 1000.0;
    }

    // Liter to ml or vice versa
    if (isL(sUnit) && isMl(tUnit)) {
      return stockPrice / 1000.0;
    }
    if (isMl(sUnit) && isL(tUnit)) {
      return stockPrice * 1000.0;
    }

    return stockPrice;
  }

  function resolveIngredientPrice(name, qty, unit, defaultUnitPrice, fallbackPrice) {
    const stockItem = findStockItem(name);
    if (stockItem && parseFloat(stockItem.Price) > 0) {
      const unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, unit);
      const totalPrice = (qty || 0) * unitPrice;
      return {
        price: totalPrice,
        unitPrice: unitPrice,
        fromStock: true
      };
    }
    const effUnitPrice = defaultUnitPrice || 0;
    const totalPrice = (fallbackPrice !== undefined) ? fallbackPrice : ((qty || 0) * effUnitPrice);
    return {
      price: totalPrice,
      unitPrice: effUnitPrice,
      fromStock: false
    };
  }

  function refreshProductionIngredientsPrices() {
    // 1. Update auto rows
    const autoRows = document.querySelectorAll('#ingredients-table tbody tr.auto-row');
    if (loadedAutoIngredients && loadedAutoIngredients.length > 0) {
      loadedAutoIngredients.forEach((item, index) => {
        const stockItem = findStockItem(item.name);
        if (stockItem && parseFloat(stockItem.Price) > 0) {
          const unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, item.unit);
          item.unitPrice = unitPrice;
          item.price = (item.qty || 0) * unitPrice;
          if (autoRows[index]) {
            const priceInput = autoRows[index].querySelector('.auto-ingredient-price');
            if (priceInput) priceInput.value = item.price.toFixed(1);
          }
        }
      });
    }

    // 2. Update custom rows
    const customRows = document.querySelectorAll('#ingredients-table tbody tr.custom-row');
    if (customIngredients && customIngredients.length > 0) {
      customIngredients.forEach((item, index) => {
        const stockItem = findStockItem(item.name);
        if (stockItem && parseFloat(stockItem.Price) > 0) {
          const unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, item.unit);
          item.unitPrice = unitPrice;
          item.price = (item.qty || 0) * unitPrice;
          if (customRows[index]) {
            const priceInput = customRows[index].querySelector('.custom-ingredient-price');
            if (priceInput) priceInput.value = item.price.toFixed(1);
          }
        }
      });
    }

    sumTotalCosts();
  }

  function loadIngredientStockData(callback) {
    if (!loggedInUsername) return;
    google.script.run.withSuccessHandler(function(data) {
      ingredientStockData = data || [];
      updateStockDatalist();
      refreshProductionIngredientsPrices();
      if (callback && typeof callback === 'function') callback(ingredientStockData);
    }).withFailureHandler(function(err) {
      console.warn('Could not preload ingredient stock:', err);
    }).getIngredientStock(loggedInUsername);
  }

  function updateAutoIngredient(index, field, value) {
    if (loadedAutoIngredients && loadedAutoIngredients[index]) {
      if (field === 'name') {
        loadedAutoIngredients[index]['name'] = value;
        const stockItem = findStockItem(value);
        if (stockItem && parseFloat(stockItem.Price) > 0) {
          const unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, loadedAutoIngredients[index].unit);
          loadedAutoIngredients[index].unitPrice = unitPrice;
          const newPrice = (loadedAutoIngredients[index].qty || 0) * unitPrice;
          loadedAutoIngredients[index].price = newPrice;
          const rows = document.querySelectorAll('#ingredients-table tbody tr.auto-row');
          if (rows[index]) {
            const priceInput = rows[index].querySelector('.auto-ingredient-price');
            if (priceInput) priceInput.value = newPrice.toFixed(1);
          }
          sumTotalCosts();
        }
      } else if (field === 'qty') {
        const qtyVal = parseFloat(value) || 0;
        loadedAutoIngredients[index]['qty'] = qtyVal;
        let unitPrice = loadedAutoIngredients[index].unitPrice;
        const stockItem = findStockItem(loadedAutoIngredients[index].name);
        if (stockItem && parseFloat(stockItem.Price) > 0) {
          unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, loadedAutoIngredients[index].unit);
          loadedAutoIngredients[index].unitPrice = unitPrice;
        }
        if (unitPrice !== undefined && unitPrice !== null && unitPrice > 0) {
          const newPrice = qtyVal * unitPrice;
          loadedAutoIngredients[index].price = newPrice;
          const rows = document.querySelectorAll('#ingredients-table tbody tr.auto-row');
          if (rows[index]) {
            const priceInput = rows[index].querySelector('.auto-ingredient-price');
            if (priceInput) priceInput.value = newPrice.toFixed(1);
          }
        }
      } else if (field === 'unit') {
        loadedAutoIngredients[index]['unit'] = value;
        const stockItem = findStockItem(loadedAutoIngredients[index].name);
        if (stockItem && parseFloat(stockItem.Price) > 0) {
          const unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, value);
          loadedAutoIngredients[index].unitPrice = unitPrice;
          const newPrice = (loadedAutoIngredients[index].qty || 0) * unitPrice;
          loadedAutoIngredients[index].price = newPrice;
          const rows = document.querySelectorAll('#ingredients-table tbody tr.auto-row');
          if (rows[index]) {
            const priceInput = rows[index].querySelector('.auto-ingredient-price');
            if (priceInput) priceInput.value = newPrice.toFixed(1);
          }
          sumTotalCosts();
        }
      } else if (field === 'price') {
        loadedAutoIngredients[index]['price'] = parseFloat(value) || 0;
      }
    }

  function updateCustomIngredient(index, field, value) {
    if (!customIngredients[index]) return;
    if (field === 'name') {
      customIngredients[index]['name'] = value;
      const stockItem = findStockItem(value);
      if (stockItem) {
        if (stockItem.Unit) {
          customIngredients[index]['unit'] = stockItem.Unit;
          const rows = document.querySelectorAll('#ingredients-table tbody tr.custom-row');
          if (rows[index]) {
            const unitInput = rows[index].querySelector('.custom-ingredient-unit');
            if (unitInput) unitInput.value = stockItem.Unit;
          }
        }
        if (parseFloat(stockItem.Price) > 0) {
          const unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, customIngredients[index].unit);
          customIngredients[index].unitPrice = unitPrice;
          const newPrice = (customIngredients[index].qty || 0) * unitPrice;
          customIngredients[index].price = newPrice;
          const rows = document.querySelectorAll('#ingredients-table tbody tr.custom-row');
          if (rows[index]) {
            const priceInput = rows[index].querySelector('.custom-ingredient-price');
            if (priceInput) priceInput.value = newPrice.toFixed(1);
          }
          sumTotalCosts();
        }
      }
    } else if (field === 'qty') {
      const qtyVal = parseFloat(value) || 0;
      customIngredients[index]['qty'] = qtyVal;
      let unitPrice = customIngredients[index].unitPrice;
      const stockItem = findStockItem(customIngredients[index].name);
      if (stockItem && parseFloat(stockItem.Price) > 0) {
        unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, customIngredients[index].unit);
        customIngredients[index].unitPrice = unitPrice;
      }
      if (unitPrice !== undefined && unitPrice !== null && unitPrice > 0) {
        const newPrice = qtyVal * unitPrice;
        customIngredients[index].price = newPrice;
        const rows = document.querySelectorAll('#ingredients-table tbody tr.custom-row');
        if (rows[index]) {
          const priceInput = rows[index].querySelector('.custom-ingredient-price');
          if (priceInput) priceInput.value = newPrice.toFixed(1);
        }
      }
    } else if (field === 'unit') {
      customIngredients[index]['unit'] = value;
      const stockItem = findStockItem(customIngredients[index].name);
      if (stockItem && parseFloat(stockItem.Price) > 0) {
        const unitPrice = convertStockPriceToUnit(parseFloat(stockItem.Price), stockItem.Unit, value);
        customIngredients[index].unitPrice = unitPrice;
        const newPrice = (customIngredients[index].qty || 0) * unitPrice;
        customIngredients[index].price = newPrice;
        const rows = document.querySelectorAll('#ingredients-table tbody tr.custom-row');
        if (rows[index]) {
          const priceInput = rows[index].querySelector('.custom-ingredient-price');
          if (priceInput) priceInput.value = newPrice.toFixed(1);
        }
        sumTotalCosts();
      }
    } else if (field === 'price') {
      customIngredients[index]['price'] = parseFloat(value) || 0;
    }
  }

  // Summing total costs
  function sumTotalCosts() {
    let sumIngredients = 0;

    // Default calculations
    const defaultPrices = document.querySelectorAll('.auto-ingredient-price');
    defaultPrices.forEach(input => {
      sumIngredients += parseFloat(input.value) || 0;
    });

    // Custom ingredients
    const customPrices = document.querySelectorAll('.custom-ingredient-price');
    customPrices.forEach(input => {
      sumIngredients += parseFloat(input.value) || 0;
    });

    // Addons
    let sumAddons = 0;
    const addonPrices = document.querySelectorAll('.custom-addon-price');
    addonPrices.forEach(input => {
      sumAddons += parseFloat(input.value) || 0;
    });

    const pkgCost = parseFloat(document.getElementById('batch-pkg-cost').value) || 0;
    const netCost = sumIngredients + sumAddons + pkgCost;

    document.getElementById('total-ingredients-cost-display').textContent = (sumIngredients + sumAddons).toFixed(1) + ' ฿';
    document.getElementById('total-batch-cost-display').textContent = netCost.toFixed(1) + ' ฿';
    calculateExpectedProfit();
  }

        navigateToSection('distilled-spirits');

    }).withFailureHandler(function(err) {
      hideLoader();
      const msg = (err && err.message) ? err.message : (typeof err === 'string' ? err : 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      showToast(msg, 'error');
    }).saveBatch(batchObj);
  }

  // Load a batch's state back into the creator form for editing
  function loadBatchToForm(idOrBatch) {
    deletedAutoIngredientNames.clear();
    let batch;
    if (idOrBatch && typeof idOrBatch === 'object') {
      batch = idOrBatch;
    } else {
      batch = batches.find(b => b.ID === idOrBatch);
    }
    
    if (!batch) {
      showToast('ไม่พบข้อมูลแบทช์สุรานี้', 'error');
      return;
    }

    editingBatchId = batch.ID;
    document.getElementById('editing-banner').style.display = 'flex';
    document.getElementById('batch-id').value = batch.ID;
    document.getElementById('batch-title').value = batch.Title;
    
    // Parse date
    if (batch.Date) {
      const d = new Date(batch.Date);
      if (!isNaN(d.getTime())) {
        document.getElementById('batch-date').value = batch.Date.split('T')[0];
      }
    }
    
    let raw = {};
    try {
      raw = typeof batch.RawData === 'string' ? JSON.parse(batch.RawData) : batch.RawData;
    } catch(e) {
      raw = batch;
    }

    document.getElementById('batch-test-result').value = raw.testResult || 'รอเทส';
    
    // Restore optional dates and production type
    document.getElementById('batch-date-ferment-end').value = raw.dateFermentEnd || '';
    const prodType = raw.productionType || 'ทำขายจริง';
    document.getElementById('chk-prod-real').checked = (prodType === 'ทำขายจริง');
    document.getElementById('chk-prod-test').checked = (prodType === 'ทำทดลองสูตร');
    document.getElementById('batch-expected-sales').value = raw.expectedSales || 0;
    toggleSalesProfitCard();
    
    if (raw.postFermentations) {
      postFermentations = raw.postFermentations;

  // SWITCH SPIRITS SUB-TAB (waiting, fermenting, distilling, filtering, completed)
  function switchSpiritsSubTab(group, activeState) {
    const container = document.getElementById(`${group}-sub-tabs`);
    if (container) {
      const buttons = container.querySelectorAll('.sub-tab-btn');
      buttons.forEach(btn => {
        if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${activeState}'`)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
    
    let subPanes = [];
    if (group === 'distilled' || group === 'fermented') {
      subPanes = ['waiting', 'fermenting', 'distilling', 'filtering', 'completed'];
    } else if (group === 'soda') {
      subPanes = ['waiting', 'fermenting', 'completed'];
    } else {
      subPanes = ['waiting', 'fermenting', 'aging', 'completed'];
    }
      
    subPanes.forEach(pane => {
      const grid = document.getElementById(`${group}-${pane}-grid`);
      if (grid) {
        if (pane === activeState) {
          grid.classList.add('show');
        } else {
          grid.classList.remove('show');
        }
      }
    });
  }

  // Auto-switch sub-tabs based on the target batch status name
  function autoSwitchSubTabAfterStatusUpdate(newStatus) {
    if (!newStatus) return;
    const mappings = {
      // Distilled
      'รอหมักสุรากลั่น': { group: 'distilled', state: 'waiting' },
      'หมักสุรากลั่น': { group: 'distilled', state: 'fermenting' },
      'กลั่นสุรากลั่น': { group: 'distilled', state: 'distilling' },
      'กรองสุรากลั่น': { group: 'distilled', state: 'filtering' },
      'เสร็จสมบูรณ์กลั่น': { group: 'distilled', state: 'completed' },
      
      // Brewed (สุราแช่)
      'รอหมักสุราแช่': { group: 'brewed', state: 'waiting' },
      'หมักสุราแช่': { group: 'brewed', state: 'fermenting' },
      'บ่มน้ำสุราแช่': { group: 'brewed', state: 'aging' },
      'เสร็จสมบูรณ์แช่': { group: 'brewed', state: 'completed' },
      
      // Fermented (สุราหมัก)
      'รอหมักสุราหมัก': { group: 'fermented', state: 'waiting' },
      'หมักสุราหมัก': { group: 'fermented', state: 'fermenting' },
      'กลั่นสุราหมัก': { group: 'fermented', state: 'distilling' },
      'กรองสุราหมัก': { group: 'fermented', state: 'filtering' },
      'เสร็จสมบูรณ์หมัก': { group: 'fermented', state: 'completed' },

      // Soda (โซดา)
      'รอหมักโซดา': { group: 'soda', state: 'waiting' },
      'หมักโซดา': { group: 'soda', state: 'fermenting' },
      'เสร็จสิ้นการทำโซดา': { group: 'soda', state: 'completed' }
    };
    
    const map = mappings[newStatus.toString().trim()];
    if (map) {
      switchSpiritsSubTab(map.group, map.state);
    }
  }

  function handleInlineSalesInput(input) {
    const card = input.closest('.batch-item-card') || input.closest('.batch-card');
    if (!card) return;
    const cost = parseFloat(input.getAttribute('data-cost')) || 0;
    const sales = parseFloat(input.value) || 0;
    const profit = sales - cost;
    const profitEl = card.querySelector('.inline-profit-display');
    if (profitEl) {
      profitEl.textContent = profit.toFixed(1) + ' ฿';
      profitEl.style.color = profit >= 0 ? 'var(--color-emerald)' : '#ef4444';
    }
  }

  function renderStatusGrid(containerId, targetStatus, typeFilter) {
    try {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';

      let filtered = batches.filter(b => {
        if (!b.Status) return false;
        const bs = b.Status.toString().trim();
        const ts = targetStatus.trim();
        if (bs === ts) return true;
        
        // Backward compatibility mapping for distilled spirits
        if (typeFilter === 'สุรากลั่น') {
          if (ts === 'รอหมักสุรากลั่น' && bs === 'รอหมักสุรา') return true;
          if (ts === 'หมักสุรากลั่น' && bs === 'หมักสุรา') return true;
          if (ts === 'กลั่นสุรากลั่น' && bs === 'กลั่นสุรา') return true;
          if (ts === 'กรองสุรากลั่น' && bs === 'กรองสุรา') return true;
          if (ts === 'เสร็จสมบูรณ์กลั่น' && (bs === 'เสร็จสมบูรณ์' || bs === 'ประวัติกลั่น' || bs === 'เสร็จสมบูรณ์กลั่น')) return true;
        }
        // Backward compatibility mapping for brewed spirits
        if (typeFilter === 'สุราแช่') {
          if (ts === 'รอหมักสุราแช่' && bs === 'รอหมักสุรา') return true;
          if (ts === 'หมักสุราแช่' && bs === 'หมักสุรา') return true;
          if (ts === 'เสร็จสมบูรณ์แช่' && (bs === 'เสร็จสมบูรณ์' || bs === 'ประวัติแช่' || bs === 'เสร็จสมบูรณ์แช่')) return true;
        }
        // Backward compatibility mapping for fermented spirits
        if (typeFilter === 'สุราหมัก') {
          if (ts === 'รอหมักสุราหมัก' && bs === 'รอหมักสุรา') return true;
          if (ts === 'หมักสุราหมัก' && bs === 'หมักสุรา') return true;
          if (ts === 'เสร็จสมบูรณ์หมัก' && (bs === 'เสร็จสมบูรณ์' || bs === 'ประวัติหมัก' || bs === 'เสร็จสมบูรณ์หมัก')) return true;
        }
        // Soda (โซดา)
        if (typeFilter === 'โซดา') {
          if (ts === 'รอหมักโซดา' && bs === 'รอหมักโซดา') return true;
          if (ts === 'หมักโซดา' && bs === 'หมักโซดา') return true;
          if (ts === 'เสร็จสิ้นการทำโซดา' && bs === 'เสร็จสิ้นการทำโซดา') return true;
        }
        return false;
      });

      // Filter by typeFilter
      filtered = filtered.filter(b => {
        let raw = {};
        try {
          raw = typeof b.RawData === 'string' ? JSON.parse(b.RawData) : b.RawData;
        } catch (e) {
          raw = b;
        }
        const spiritsType = raw.spiritsType || 'สุรากลั่น';
        return spiritsType === typeFilter;
      });

      // Check completed status filter
      let displayList = filtered;
      const isCompletedTab = targetStatus === 'เสร็จสมบูรณ์กลั่น' || targetStatus === 'เสร็จสมบูรณ์แช่' || targetStatus === 'เสร็จสมบูรณ์หมัก' || targetStatus === 'เสร็จสิ้นการทำโซดา';

        const statusSelect = card.querySelector('.inline-status-select');

        const daysGroup = card.querySelector('.inline-days-group');
        if (statusSelect) {
          statusSelect.addEventListener('change', function() {
            const val = this.value;
            if (testResultContainer) {
              testResultContainer.style.display = completedStatuses.has(val) ? 'block' : 'none';
            }
            if (daysGroup) {
              const isSodaFermentingOrCompletedNow = typeFilter === 'โซดา' && (val === 'หมักโซดา' || val === 'เสร็จสิ้นการทำโซดา');

          });

        const saveBtn = card.querySelector('.inline-save-btn');
        if (saveBtn) {
          saveBtn.onclick = function() {
            const id = this.getAttribute('data-id');
            const statusSelect = card.querySelector('.inline-status-select');
            if (!statusSelect) return;
            const newStatus = statusSelect.value;
            
            let fermentationDays = 0;
            const daysInput = card.querySelector('.inline-days-input');
            if (daysInput) {
              fermentationDays = parseInt(daysInput.value) || 0;
            }

            let testResult = null;
            const isCompletedStatus = newStatus === 'เสร็จสมบูรณ์กลั่น' || newStatus === 'เสร็จสมบูรณ์แช่' || newStatus === 'เสร็จสมบูรณ์หมัก' || newStatus === 'เสร็จสมบูรณ์' || newStatus === 'ประวัติกลั่น' || newStatus === 'ประวัติแช่' || newStatus === 'ประวัติหมัก' || newStatus === 'เสร็จสิ้นการทำโซดา';
            if (isCompletedStatus) {
              const testSelect = card.querySelector('.inline-test-result-select');
              if (testSelect) {
                testResult = testSelect.value;
              }
            }

            let expectedSales = null;
            const salesInput = card.querySelector('.inline-sales-input');
            if (salesInput && salesInput.value.trim() !== '') {
              expectedSales = parseFloat(salesInput.value) || 0;
            }

            let distillVolReal = null;
            const distillVolInput = card.querySelector('.inline-distill-vol-input');
            if (distillVolInput && distillVolInput.value.trim() !== '') {
              distillVolReal = parseFloat(distillVolInput.value) || 0;
            }

            showLoader('กำลังบันทึกข้อมูล...');
            google.script.run.withSuccessHandler(function(res) {
              showToast('บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
              sendTelegramStatusChangedAlert(id, newStatus, fermentationDays);
              autoSwitchSubTabAfterStatusUpdate(newStatus);
              fetchBatches(false);
            }).withFailureHandler(function(err) {
              hideLoader();
              showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + (err.message || err.toString()), 'error');
            }).updateBatchStatus(id, newStatus, fermentationDays, testResult, loggedInUsername, expectedSales, distillVolReal);
          };
        }

        // Set listener for delete button
        const deleteBtn = card.querySelector('.inline-delete-btn');
        if (deleteBtn) {
          deleteBtn.onclick = function() {
            const id = this.getAttribute('data-id');
            const title = this.getAttribute('data-title');
            if (confirm('⚠️ ยืนยันการลบข้อมูล\n\nลบ "' + title + '" ใช่หรือไม่?\nข้อมูลจะถูกลบถาวรและไม่สามารถกู้คืนได้')) {
              showLoader('กำลังลบข้อมูล...');
              google.script.run.withSuccessHandler(function(res) {
                showToast('ลบข้อมูลแบทช์เรียบร้อยแล้ว', 'success');
                fetchBatches(false);
              }).withFailureHandler(function(err) {
                hideLoader();
                showToast('เกิดข้อผิดพลาดในการลบข้อมูล: ' + err, 'error');
              }).deleteBatch(id, loggedInUsername);
            }
          };
        }

        container.appendChild(card);
      });
    } catch (err) {
      alert('เกิดข้อผิดพลาดในการแสดงผลหน้าตาราง (Rendering Error):\n' + err.toString() + '\nStack:\n' + err.stack);
    }
  }

  function changeEditorStepColor(el, idx, color) {
    collectChecklistStepsFromUI();
    checklistTemplate[idx].color = color;
    
    // Update active class in UI
    const parent = el.parentNode;
    parent.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
    el.classList.add('active');
  }

  function renderChecklistEditor() {
    const container = document.getElementById('checklist-editor-container');
    container.innerHTML = '';
    checklistTemplate.forEach((step, idx) => {
      const stepObj = (typeof step === 'object') ? step : { text: step, color: 'blue' };
      const item = document.createElement('div');
      item.style.display = 'flex';
      item.style.gap = '0.5rem';
      item.style.marginBottom = '0.5rem';
      item.style.alignItems = 'center';
      item.innerHTML = `
        <span style="font-weight:600; width:90px; font-size:0.85rem;">ขั้นตอนที่ ${idx+1}:</span>
        <textarea class="input-control checklist-step-input" style="flex:1; resize:vertical; min-height:40px;">${stepObj.text}</textarea>
        <div class="editor-color-picker" style="display: flex; gap: 0.3rem; margin-right: 0.5rem;">
          <div class="color-dot red ${stepObj.color === 'red' ? 'active' : ''}" title="สีแดง" onclick="changeEditorStepColor(this, ${idx}, 'red');" style="width: 14px; height: 14px; border-radius: 50%; background: #ef4444; cursor: pointer;"></div>
          <div class="color-dot green ${stepObj.color === 'green' ? 'active' : ''}" title="สีเขียว" onclick="changeEditorStepColor(this, ${idx}, 'green');" style="width: 14px; height: 14px; border-radius: 50%; background: #10b981; cursor: pointer;"></div>
          <div class="color-dot blue ${stepObj.color === 'blue' ? 'active' : ''}" title="สีฟ้า" onclick="changeEditorStepColor(this, ${idx}, 'blue');" style="width: 14px; height: 14px; border-radius: 50%; background: #3b82f6; cursor: pointer;"></div>
        </div>
        <button class="btn btn-secondary btn-sm" type="button" onclick="moveChecklistStep(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn btn-secondary btn-sm" type="button" onclick="moveChecklistStep(${idx}, 1)" ${idx === checklistTemplate.length - 1 ? 'disabled' : ''}>▼</button>
        <button class="btn btn-danger btn-sm" type="button" onclick="removeChecklistStep(${idx})">ลบ</button>
      `;
      container.appendChild(item);
    });
  }

  function collectChecklistStepsFromUI() {
    const inputs = document.querySelectorAll('.checklist-step-input');
    inputs.forEach((input, idx) => {
      const current = checklistTemplate[idx];
      const currentColor = (typeof current === 'object') ? (current.color || 'blue') : 'blue';
      checklistTemplate[idx] = { text: input.value, color: currentColor };
    });
  }

  function moveChecklistStep(index, direction) {
    collectChecklistStepsFromUI();
    const targetIndex = index + direction;
    if (targetIndex >= 0 && targetIndex < checklistTemplate.length) {
      const temp = checklistTemplate[index];
      checklistTemplate[index] = checklistTemplate[targetIndex];
      checklistTemplate[targetIndex] = temp;
      renderChecklistEditor();
    }
  }

  function removeChecklistStep(index) {
    collectChecklistStepsFromUI();
    checklistTemplate.splice(index, 1);
    renderChecklistEditor();
  }

  function addChecklistStepRow() {
    collectChecklistStepsFromUI();
    checklistTemplate.push({ text: '', color: 'blue' });
    renderChecklistEditor();
  }

  function changeSpreadsheetId() {
    const currentId = currentSpreadsheetId || '';
    const newId = prompt('กรุณากรอก Google Spreadsheet ID หรือวาง URL ของชีตที่คุณต้องการเชื่อมต่อ:', currentId);
    if (newId === null) return;
    
    let targetId = newId.trim();
    if (targetId.includes('/d/')) {
      const parts = targetId.split('/d/');
      if (parts.length > 1) {
        targetId = parts[1].split('/')[0];
      }
    }
    
    if (!targetId) {
      alert('Spreadsheet ID ไม่ถูกต้อง');
      return;
    }
    
    showLoader('กำลังเชื่อมต่อกับ Google Sheet ใหม่...');
    google.script.run.withSuccessHandler(function(res) {
      if (res.success) {
        showToast('เชื่อมต่อ Google Sheet ใหม่สำเร็จแล้ว กำลังโหลดข้อมูล...', 'success');
        location.reload();
      } else {
        hideLoader();
        alert('ไม่สามารถเชื่อมต่อกับ Google Sheet นี้ได้: ' + res.message);
      }
    }).setSpreadsheetId(targetId);
  }

  // --- INGREDIENT STOCK MANAGEMENT ---

  function renderIngredientStock() {

    // โหลดหน่วยวัตถุดิบเตรียมไว้ก่อน

  }

  function displayIngredientStock(items) {
    const tbody = document.getElementById('stock-table-body');
    tbody.innerHTML = '';
    
    // Calculate stats
    let totalItems = items.length;
    let lowStockItems = 0;
    let okStockItems = 0;
    let totalValue = 0;
    
    if (totalItems === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" style="padding: 3rem; text-align: center; color: var(--text-muted);">
            <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin: 0 auto 1rem; display: block; opacity: 0.3;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
            ไม่พบข้อมูลวัตถุดิบในสต๊อก สามารถเพิ่มใหม่ได้ที่ปุ่มด้านบน
          </td>
        </tr>
      `;
    } else {
      items.forEach(function(item) {
        const qty = parseFloat(item.Quantity) || 0;
        const minQty = parseFloat(item.MinQuantity) || 0;
        const price = parseFloat(item.Price) || 0;
        const itemVal = qty * price;
        totalValue += itemVal;
        
        let statusBadge = '';
        const isLow = qty <= minQty;
        if (isLow) {
          statusBadge = '<span style="background: rgba(245,158,11,0.15); color: #fbbf24; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600;">⚠️ ต่ำกว่าเกณฑ์</span>';
          lowStockItems++;
        } else {
          statusBadge = '<span style="background: rgba(16,185,129,0.15); color: #34d399; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600;">✅ ปกติ</span>';
          okStockItems++;
        }
        
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid rgba(255,255,255,0.06)';
        tr.innerHTML = `
          <td style="padding: 0.75rem 1rem; font-weight: 600; color: ${isLow ? '#ff4d4d' : '#fff'};">${item.Name}</td>
          <td style="padding: 0.75rem 1rem; color: var(--text-secondary);">${item.Category || '-'}</td>
          <td style="padding: 0.75rem 1rem; text-align: right; font-weight: 600; color: ${isLow ? '#ff4d4d' : '#fff'};">${qty.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 2})}</td>
          <td style="padding: 0.75rem 1rem; text-align: right; color: var(--text-secondary);">${item.Unit}</td>
          <td style="padding: 0.75rem 1rem; text-align: right; color: var(--text-muted);">${minQty.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 2})}</td>
          <td style="padding: 0.75rem 1rem; text-align: right; color: var(--text-secondary);">${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ฿</td>
          <td style="padding: 0.75rem 1rem; text-align: right; font-weight: 600; color: var(--color-purple);">${itemVal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ฿</td>
          <td style="padding: 0.75rem 1rem; text-align: center;">${statusBadge}</td>
          <td style="padding: 0.75rem 1rem; text-align: center;">
            <div style="display: flex; gap: 0.4rem; justify-content: center;">
              <button class="btn btn-secondary btn-sm" onclick="showAdjustModal('${item.ID}', '${item.Name}', '${item.Unit}')" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">📊 ปรับสต๊อก</button>
              <button class="btn btn-secondary btn-sm" onclick="showEditIngredientModal('${item.ID}')" style="padding: 0.2rem 0.4rem; font-size: 0.7rem; color: var(--color-cyan);">✏️ แก้ไข</button>
              <button class="btn btn-danger btn-sm" onclick="deleteIngredient('${item.ID}', '${item.Name}')" style="padding: 0.2rem 0.4rem; font-size: 0.7rem;">🗑️ ลบ</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    
    // Update Summaries
    document.getElementById('stock-stat-total').textContent = totalItems + ' รายการ';
    document.getElementById('stock-stat-low').textContent = lowStockItems + ' รายการ';
    document.getElementById('stock-stat-ok').textContent = okStockItems + ' รายการ';
    document.getElementById('stock-stat-value').textContent = totalValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ฿';
  }

  function filterIngredientStock() {
    const searchVal = document.getElementById('stock-search-input').value.toLowerCase().trim();
    const categoryVal = document.getElementById('stock-category-filter').value;
    
    const filtered = ingredientStockData.filter(function(item) {
      const matchSearch = !searchVal || item.Name.toLowerCase().includes(searchVal) || (item.Supplier && item.Supplier.toLowerCase().includes(searchVal));
      const matchCategory = !categoryVal || item.Category === categoryVal;
      return matchSearch && matchCategory;
    });
    
    displayIngredientStock(filtered);
  }

  let allIngredientUnits = [];

  function loadIngredientUnits(callback) {
    google.script.run.withSuccessHandler(function(data) {
      allIngredientUnits = Array.isArray(data) ? data : [];
      updateUnitsSelectDropdown();
      if (callback && typeof callback === 'function') callback();
    }).withFailureHandler(function(err) {
      console.error("Failed to load units:", err);
      // Fallback
      allIngredientUnits = [
        { ID: 1, UnitName: 'กก.', Username: 'admin' },
        { ID: 2, UnitName: 'กรัม', Username: 'admin' },
        { ID: 3, UnitName: 'ลิตร', Username: 'admin' },
        { ID: 4, UnitName: 'ถุง', Username: 'admin' },
        { ID: 5, UnitName: 'กล่อง', Username: 'admin' }
      ];
      updateUnitsSelectDropdown();
      if (callback && typeof callback === 'function') callback();
    }).getIngredientUnits(loggedInUsername);
  }

  function updateUnitsSelectDropdown() {
    const select = document.getElementById('modal-unit');
    if (!select) return;
    select.innerHTML = '';
    
    if (allIngredientUnits.length === 0) {
      allIngredientUnits = [
        { ID: 1, UnitName: 'กก.', Username: 'admin' },
        { ID: 2, UnitName: 'กรัม', Username: 'admin' },
        { ID: 3, UnitName: 'ลิตร', Username: 'admin' },
        { ID: 4, UnitName: 'ถุง', Username: 'admin' },
        { ID: 5, UnitName: 'กล่อง', Username: 'admin' }
      ];
    }
    
    allIngredientUnits.forEach(unit => {
      const opt = document.createElement('option');
      opt.value = unit.UnitName;
      opt.textContent = unit.UnitName;
      select.appendChild(opt);
    });
